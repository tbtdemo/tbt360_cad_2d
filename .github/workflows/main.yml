name: CAD 360 Viet Nam - TBT Windows CI

on:
  workflow_dispatch:
  push:
    branches: [main, fix/cad360-windows-regression-20261101]
    paths:
      - 'SOURCE_CAD_R65/**'
      - 'installer/**'
      - '.github/workflows/main.yml'

concurrency:
  group: cad360-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-core:
    name: "1 - Build Core"
    runs-on: windows-latest
    defaults:
      run:
        working-directory: SOURCE_CAD_R65
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: SOURCE_CAD_R65
      - name: Verify pinned lockfile
        run: cargo metadata --locked --no-deps --format-version 1 > $null
      - name: Verify CADCraft updater is absent from TBT runtime
        shell: pwsh
        run: |
          $hits = git grep -n -E "craft_update|suite::CADCRAFT|enable_update_check|updates_ui" -- apps/cadcraft/src crates/ui-egui/src
          $grepExit = $LASTEXITCODE
          if ($grepExit -eq 0 -and $hits) {
            $hits | Write-Host
            throw "Upstream CADCraft updater code is still referenced by the TBT runtime"
          }
          if ($grepExit -ne 0 -and $grepExit -ne 1) { throw "git grep failed with exit code $grepExit" }
          $global:LASTEXITCODE = 0
      - name: Check complete Rust workspace
        run: cargo check --workspace --locked

  unified-ui:
    name: "2 - Unified CAD UI"
    runs-on: windows-latest
    defaults:
      run:
        working-directory: SOURCE_CAD_R65
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: SOURCE_CAD_R65
      - name: Test menus and command dispatch
        run: cargo test --locked -p cadcraft-ui-egui menus::tests -- --nocapture
      - name: Test Layers
        run: cargo test --locked -p cadcraft-ui-egui layers::tests -- --nocapture
      - name: Test Properties palettes
        run: cargo test --locked -p cadcraft-ui-egui palettes::tests -- --nocapture
      - name: Verify separate legacy launchers are absent
        shell: pwsh
        working-directory: .
        run: |
          foreach ($p in @("CHAY_QTO_WEB_THAM_CHIEU.bat","CHAY_CAD_GOC_014.bat","CHAY_EXE_R65_SAU_BUILD.bat")) {
            if (Test-Path $p) { throw "Legacy separate launcher must not ship in unified product flow: $p" }
          }

  vi-tbt-branding:
    name: "3 - Vietnamese and TBT Branding"
    runs-on: windows-latest
    defaults:
      run:
        working-directory: SOURCE_CAD_R65
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: SOURCE_CAD_R65
      - name: Test localization catalogs
        run: cargo test --locked -p cadcraft-ui-egui i18n::tests -- --nocapture
      - name: Verify Vietnamese catalog exists
        shell: pwsh
        run: |
          if (!(Test-Path "crates/ui-egui/src/i18n/vi.tsv")) { throw "Missing Vietnamese catalog" }
          if ((Get-Item "crates/ui-egui/src/i18n/vi.tsv").Length -lt 1000) { throw "Vietnamese catalog is unexpectedly small" }
      - name: Verify TBT product title
        shell: pwsh
        run: |
          $main = Get-Content "apps/cadcraft/src/main.rs" -Raw
          if ($main -notmatch '\.with_title\("CAD 360 Việt Nam - TBT"\)') { throw "TBT runtime window title missing or changed" }

  regression-shards:
    name: "4 - Regression / ${{ matrix.test.name }}"
    runs-on: windows-latest
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        test:
          - name: Native Takeoff
            command: cargo test --locked -p cadcraft takeoff::tests -- --nocapture
          - name: DXF DWG IO
            command: cargo test --locked -p cadcraft-io --test it -- --nocapture
          - name: Undo Redo
            command: cargo test --locked -p cadcraft-engine --test undo_control -- --nocapture
          - name: Atomic Save
            command: cargo test --locked -p cadcraft-engine atomic_write::tests -- --nocapture
          - name: BIM Permissions
            command: cargo test --locked -p cadcraft bim_collab::tests -- --nocapture
          - name: BIM Sync Isolation
            command: cargo test --locked -p cadcraft bim_sync::tests -- --nocapture
          - name: Legacy Clipboard
            command: cargo test --locked -p cadcraft-engine --test clipboard -- --nocapture
          - name: Clipboard Real DXF
            command: cargo test --locked -p cadcraft-engine --test clipboard_real_dxf -- --nocapture
          - name: Legacy DXF XData
            command: cargo test --locked -p cadcraft-engine --test it xdata_follows_entity -- --nocapture
          - name: Legacy 3D Modeling
            command: cargo test --locked -p cadcraft-engine --test modeling3d_r16 -- --nocapture
          - name: Complete Workspace Compile
            command: cargo test --workspace --locked --no-run
    defaults:
      run:
        working-directory: SOURCE_CAD_R65
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: SOURCE_CAD_R65
          key: regression-${{ matrix.test.name }}
      - name: Test ${{ matrix.test.name }}
        run: ${{ matrix.test.command }}

  regression-tests:
    name: "4 - Aggregate Regression Gate"
    needs: [regression-shards]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every regression shard to pass
        env:
          SHARD_RESULT: ${{ needs.regression-shards.result }}
        run: test "$SHARD_RESULT" = "success"

  release-windows:
    name: "Release - Single Windows Setup"
    needs: [build-core, unified-ui, vi-tbt-branding, regression-tests]
    runs-on: windows-latest
    defaults:
      run:
        working-directory: SOURCE_CAD_R65
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: SOURCE_CAD_R65
      - name: Build release binaries
        run: cargo build --release --locked -p cadcraft -p cadcraft-cli
      - name: Verify native Windows binaries
        shell: pwsh
        run: |
          foreach ($name in @("cadcraft.exe", "cadcraft-cli.exe")) {
            $path = "target/release/$name"
            if (!(Test-Path $path)) { throw "Missing compiled binary: $path" }
            if ((Get-Item $path).Length -lt 100000) { throw "Unexpectedly small binary: $path" }
          }
          & "./target/release/cadcraft-cli.exe" --version
          if ($LASTEXITCODE -ne 0) { throw "CLI smoke test failed" }
      - name: Package portable Windows binaries
        shell: pwsh
        run: |
          $root = "../dist/CAD360_VietNam_TBT_Portable"
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          Copy-Item "target/release/cadcraft.exe" "$root/cadcraft.exe"
          Copy-Item "target/release/cadcraft-cli.exe" "$root/cadcraft-cli.exe"
          @'
          CAD 360 Viet Nam - TBT (Portable)
          1. Extract this ZIP to a writable folder on Windows x64.
          2. Double-click cadcraft.exe to launch CAD 360.
          3. cadcraft-cli.exe provides the command-line interface.
          No Rust toolchain is required on the user's machine.
          '@ | Set-Content -Encoding UTF8 "$root/README.txt"
          Compress-Archive -Path "$root/*" -DestinationPath "../dist/CAD360_VietNam_TBT_Portable.zip" -Force
          if (!(Test-Path "../dist/CAD360_VietNam_TBT_Portable.zip")) { throw "Portable archive was not created" }
          $verify = "../dist/portable-smoke"
          Expand-Archive "../dist/CAD360_VietNam_TBT_Portable.zip" $verify -Force
          & "$verify/cadcraft-cli.exe" --version
          if ($LASTEXITCODE -ne 0) { throw "Portable CLI smoke test failed" }
      - name: Upload Windows portable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: CAD360_VietNam_TBT_Windows_Portable
          path: dist/CAD360_VietNam_TBT_Portable.zip
          if-no-files-found: error
      - name: Install Inno Setup compiler
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6/ISCC.exe"
          if (!(Test-Path $iscc)) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw "Inno Setup installation failed" }
          }
          if (!(Test-Path $iscc)) { throw "ISCC.exe not found" }
      - name: Build single Windows Setup
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6/ISCC.exe"
          & $iscc "/Qp" "../installer/TBT360_CAD_R65.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup compile failed" }
          if (!(Test-Path "../dist/CAD360_VietNam_TBT_Setup.exe")) { throw "Setup EXE not created" }
      - name: Upload single Windows Setup
        uses: actions/upload-artifact@v4
        with:
          name: CAD360_VietNam_TBT_Windows_Setup
          path: dist/CAD360_VietNam_TBT_Setup.exe
          if-no-files-found: error
