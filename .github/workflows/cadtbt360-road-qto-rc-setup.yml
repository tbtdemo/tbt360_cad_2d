name: CADTBT360 Road QTO Release Candidate Windows EXE
on:
  push:
    branches:
      - feature/CADTBT360_road-qto-parallel-v1023
    paths:
      - '.github/workflows/cadtbt360-road-qto-rc-setup.yml'
      - 'CADTBT360_V1.000/apps/cadcraft/src/takeoff.rs'
      - 'CADTBT360_V1.000/apps/cadcraft/src/takeoff_road.rs'
      - 'CADTBT360_V1.000/apps/cadcraft-cli/**'
      - 'CADTBT360_V1.000/crates/mcp/**'
      - '.github/workflows/cadtbt360-agent-mcp-cli-render-windows.yml'
  workflow_dispatch:
# Keep only the newest Windows release candidate for this feature branch.
# Superseded candidates must not compete for runner/cache resources.
concurrency:
  group: cadtbt360-road-qto-rc-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  release-candidate:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout exact release candidate source
        uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.95.0'
      - name: Cache Windows Rust compilation
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: CADTBT360_V1.000
          key: road-qto-rc-v1023-windows-x64
      - name: Verify inputs and pinned commit
        run: |
          $ErrorActionPreference = 'Stop'
          if ((git rev-parse HEAD).Trim() -ne $env:GITHUB_SHA) { throw 'Checked out wrong commit' }
          foreach ($path in @('CADTBT360_V1.000/Cargo.toml','CADTBT360_V1.000/Cargo.lock','CADTBT360_V1.023.iss')) {
            if (!(Test-Path $path)) { throw "Missing release input: $path" }
          }
          cargo --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify road earthwork and Excel preview regression suite
        working-directory: CADTBT360_V1.000
        run: |
          $ErrorActionPreference = 'Stop'
          cargo test --locked -p cadcraft --bin cadcraft takeoff_road::tests -- --nocapture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p cadcraft --bin cadcraft road_station_matching_tests -- --nocapture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p cadcraft --bin cadcraft road_export_totals_use_actual_accepted_excel_rows_and_units -- --nocapture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify MCP agent and CLI render pipeline before packaging
        working-directory: CADTBT360_V1.000
        run: |
          cargo test --locked -p cadcraft-mcp --lib
          if ($LASTEXITCODE -ne 0) {exit $LASTEXITCODE}
          cargo test --locked -p cadcraft-cli --test it agent_render -- --nocapture
          if ($LASTEXITCODE -ne 0) {exit $LASTEXITCODE}
          cargo test --locked -p cadcraft-cli --test it mcp_connect -- --nocapture
          if ($LASTEXITCODE -ne 0) {exit $LASTEXITCODE}
      - name: Build Windows x64 application and AI CLI
        working-directory: CADTBT360_V1.000
        env:
          CAD360_BUILD_SHA: ${{ github.sha }}
          CADCRAFT_BUILD_SHA: ${{ github.sha }}
          CADTBT360_RELEASE_VERSION: CADTBT360_V1.023
          CADCRAFT_REQUIRE_WINRES: '1'
        run: |
          cargo build --locked --release -p cadcraft --bin cadcraft -p cadcraft-cli --bin cadcraft-cli
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify EXE identity and create portable zip
        run: |
          $ErrorActionPreference = 'Stop'
          $source='CADTBT360_V1.000/target/release/cadcraft.exe'
          if (!(Test-Path $source)) {throw 'No compiled CAD EXE'}
          $file=Get-Item $source
          if ($file.Length -lt 1048576) {throw 'Invalid small CAD EXE'}
          if ($file.VersionInfo.FileDescription -notlike '*CADTBT360_V1.023*') {throw 'Build has incorrect version metadata'}
          if ($file.VersionInfo.CompanyName -notlike '*TBT*') {throw 'TBT publisher metadata missing'}
          $bytes=[System.IO.File]::ReadAllBytes((Resolve-Path $source).Path)
          if ([Text.Encoding]::ASCII.GetString($bytes,0,2) -ne 'MZ') {throw 'Invalid PE header'}
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          $cli='CADTBT360_V1.000/target/release/cadcraft-cli.exe'
          if (!(Test-Path $cli)) {throw 'Missing AI MCP CLI EXE'}
          if ((Get-Item $cli).Length -lt 1048576) {throw 'AI MCP CLI executable too small'}
          & $cli --version
          if ($LASTEXITCODE -ne 0) {throw 'AI MCP CLI --version failed'}
          Copy-Item $source dist/CADTBT360_V1.023_RoadQTO_RC.exe
          Copy-Item $cli dist/cadcraft-cli.exe
          Compress-Archive -Path @('dist/CADTBT360_V1.023_RoadQTO_RC.exe','dist/cadcraft-cli.exe') -DestinationPath dist/CADTBT360_V1.023_RoadQTO_RC_Portable.zip -Force
      - name: Publish portable EXE even if installer stage later fails
        uses: actions/upload-artifact@v4
        with:
          name: CADTBT360_RoadQTO_RC_Portable_Windows_x64
          path: |
            dist/CADTBT360_V1.023_RoadQTO_RC.exe
            dist/cadcraft-cli.exe
            dist/CADTBT360_V1.023_RoadQTO_RC_Portable.zip
          if-no-files-found: error
          retention-days: 30
      - name: Prepare isolated Inno Setup release candidate
        run: |
          $ErrorActionPreference='Stop'
          $iss=Get-Content CADTBT360_V1.023.iss -Raw
          $iss=$iss.Replace('AppId={{6BCA4011-C394-4C3D-AB6D-3D8D5A0B1000}','AppId={{B0F10356-0A88-4226-B8FD-0D0D08F70123}')
          $iss=$iss.Replace('AppName=CAD TBT 360','AppName=CAD TBT 360 Road QTO RC')
          $iss=$iss.Replace('AppVerName=CAD TBT 360 V1.023','AppVerName=CAD TBT 360 V1.023 Road QTO RC')
          $iss=$iss.Replace('DefaultDirName={autopf}\CAD TBT 360','DefaultDirName={autopf}\CAD TBT 360 Road QTO RC')
          $iss=$iss.Replace('DefaultGroupName=CAD TBT 360','DefaultGroupName=CAD TBT 360 Road QTO RC')
          $iss=$iss.Replace('OutputBaseFilename=CADTBT360_V1.023_Setup','OutputBaseFilename=CADTBT360_V1.023_RoadQTO_RC_Setup')
          $iss=$iss.Replace('UninstallDisplayName=CAD TBT 360 V1.023','UninstallDisplayName=CAD TBT 360 V1.023 Road QTO RC')
          $iss=$iss.Replace('dist\CADTBT360_V1.023.exe','dist\CADTBT360_V1.023_RoadQTO_RC.exe')
          $iss=$iss.Replace('CADTBT360_V1.023.exe','CADTBT360_V1.023_RoadQTO_RC.exe')
          $iss=$iss.Replace('Source: "dist\CADTBT360_V1.023_RoadQTO_RC.exe"; DestDir: "{app}"; Flags: ignoreversion','Source: "dist\CADTBT360_V1.023_RoadQTO_RC.exe"; DestDir: "{app}"; Flags: ignoreversion' + "`r`n" + 'Source: "dist\cadcraft-cli.exe"; DestDir: "{app}"; Flags: ignoreversion')
          if (!$iss.Contains('Source: "dist\cadcraft-cli.exe"')) {throw 'Failed to add MCP CLI to Inno installer'}
          $iss=$iss.Replace('Name: "{autoprograms}\CAD TBT 360"','Name: "{autoprograms}\CAD TBT 360 Road QTO RC"')
          $iss=$iss.Replace('Name: "{autodesktop}\CAD TBT 360"','Name: "{autodesktop}\CAD TBT 360 Road QTO RC"')
          Set-Content CADTBT360_V1.023_RoadQTO_RC.iss -Value $iss -Encoding utf8
          $compiler="${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $compiler)) {
            choco install innosetup -y --no-progress
            if ($LASTEXITCODE -ne 0) {throw 'Inno Setup installation failed'}
          }
          & $compiler CADTBT360_V1.023_RoadQTO_RC.iss
          if ($LASTEXITCODE -ne 0) {exit $LASTEXITCODE}
          if (!(Test-Path dist/CADTBT360_V1.023_RoadQTO_RC_Setup.exe)) {throw 'Missing RC Setup'}
      - name: Smoke test isolated install and uninstall
        run: |
          $ErrorActionPreference='Stop'
          $setup=(Resolve-Path dist/CADTBT360_V1.023_RoadQTO_RC_Setup.exe).Path
          $dir=Join-Path $env:RUNNER_TEMP 'CAD360_RoadQTO_RC_smoke'
          $p=Start-Process -FilePath $setup -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',"/DIR=`"$dir`"") -Wait -PassThru
          if ($p.ExitCode -ne 0) {throw "Setup exit code $($p.ExitCode)"}
          $installed=Join-Path $dir 'CADTBT360_V1.023_RoadQTO_RC.exe'
          if (!(Test-Path $installed)) {throw 'Setup did not install RC EXE'}
          if ((Get-FileHash $installed -Algorithm SHA256).Hash -ne (Get-FileHash dist/CADTBT360_V1.023_RoadQTO_RC.exe -Algorithm SHA256).Hash) {throw 'Installed EXE mismatch'}
          $cliInstalled=Join-Path $dir 'cadcraft-cli.exe'
          if (!(Test-Path $cliInstalled)) {throw 'Installer omitted AI MCP CLI'}
          if ((Get-FileHash $cliInstalled -Algorithm SHA256).Hash -ne (Get-FileHash dist/cadcraft-cli.exe -Algorithm SHA256).Hash) {throw 'Installed AI MCP CLI mismatch'}
          & $cliInstalled --version
          if ($LASTEXITCODE -ne 0) {throw 'Installed CLI failed smoke test'}
          $uninstaller=Join-Path $dir 'unins000.exe'
          if (!(Test-Path $uninstaller)) {throw 'Uninstaller missing'}
          $un=Start-Process -FilePath $uninstaller -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART') -Wait -PassThru
          if ($un.ExitCode -ne 0) {throw "Uninstall exit code $($un.ExitCode)"}
      - name: Write checksum manifest and build provenance
        run: |
          $ErrorActionPreference='Stop'
          $files=@('dist/CADTBT360_V1.023_RoadQTO_RC.exe','dist/cadcraft-cli.exe','dist/CADTBT360_V1.023_RoadQTO_RC_Portable.zip','dist/CADTBT360_V1.023_RoadQTO_RC_Setup.exe')
          $hashes=foreach ($f in $files) {"$((Get-FileHash $f -Algorithm SHA256).Hash.ToLowerInvariant())  $(Split-Path $f -Leaf)"}
          Set-Content dist/CADTBT360_V1.023_RoadQTO_RC_SHA256.txt -Value $hashes -Encoding ascii
          Set-Content dist/BUILD_COMMIT.txt -Value $env:GITHUB_SHA -Encoding ascii
          "## CAD 360 Road QTO RC: validated installer" | Out-File $env:GITHUB_STEP_SUMMARY -Append
          "Commit: $env:GITHUB_SHA" | Out-File $env:GITHUB_STEP_SUMMARY -Append
          "Included CLI: cadcraft-cli.exe (MCP stdio, DXF, PNG)" | Out-File $env:GITHUB_STEP_SUMMARY -Append
      - name: Upload verified setup, executable and checksum
        uses: actions/upload-artifact@v4
        with:
          name: CADTBT360_RoadQTO_RC_Setup_Windows_x64
          path: |
            dist/CADTBT360_V1.023_RoadQTO_RC.exe
            dist/cadcraft-cli.exe
            dist/CADTBT360_V1.023_RoadQTO_RC_Portable.zip
            dist/CADTBT360_V1.023_RoadQTO_RC_Setup.exe
            dist/CADTBT360_V1.023_RoadQTO_RC_SHA256.txt
            dist/BUILD_COMMIT.txt
          if-no-files-found: error
          retention-days: 30
