name: CAD360 Fast Rust Syntax Gate
on:
  push:
    branches: ['fix/cad360-windows-regression-*']
    paths:
      - 'SOURCE_CAD_R65/**'
      - '.github/workflows/cad360-fast-syntax.yml'
  workflow_dispatch:
jobs:
  parse-engine-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Parse edited Rust tests before expensive Windows compilation
        shell: bash
        run: |
          set -euo pipefail
          count=0
          while IFS= read -r -d '' file; do
            rustfmt --edition 2024 --emit stdout "$file" > /dev/null
            count=$((count+1))
          done < <(find SOURCE_CAD_R65/crates/engine/src/cmd SOURCE_CAD_R65/crates/engine/tests -type f -name '*.rs' -print0)
          echo "PASS: $count Engine command and regression Rust files parse"
