name: CAD 360 Stage258 Native AI Review Window
on:
  push:
    branches:
      - feature/CADTBT360_V1.025_xref-regression
    paths:
      - CADTBT360_V1.000/crates/ui-egui/src/ai_review.rs
      - CADTBT360_V1.000/crates/ui-egui/src/lib.rs
      - CADTBT360_V1.000/crates/ui-egui/src/menus.rs
      - .github/workflows/cad360-stage258-ui-review.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-ui-ai:
    runs-on: windows-latest
    timeout-minutes: 95
    defaults:
      run:
        working-directory: CADTBT360_V1.000
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: CADTBT360_V1.000
      - name: Native CAD 360 UI build
        run: cargo check --locked -p cadcraft-ui-egui
      - name: Vietnamese AI Review parser tests
        run: cargo test --locked -p cadcraft-ui-egui stage258_room_parser -- --nocapture
