name: CAD 360 Stage271 AI Stability Regression Gate
on:
  push:
    branches:
      - feature/CADTBT360_V1.025_xref-regression
    paths:
      - CADTBT360_V1.000/crates/ui-egui/src/ai_review.rs
      - CADTBT360_V1.000/crates/ui-egui/Cargo.toml
      - CADTBT360_V1.000/crates/engine/src/undoctl.rs
      - .github/workflows/cad360-stage271-ai-stability.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reviewed-ai-stability:
    runs-on: windows-latest
    timeout-minutes: 100
    defaults:
      run:
        working-directory: CADTBT360_V1.000
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: CADTBT360_V1.000
      - name: Verify Rust toolchain and workspace state
        shell: pwsh
        run: |
          rustc --version
          cargo --version
          git rev-parse HEAD
      - name: Compile native Windows AI Review
        run: cargo check --locked -p cadcraft-ui-egui
      - name: Stage271 stale Preview and input snapshot regressions
        run: cargo test --locked -p cadcraft-ui-egui stage271 -- --nocapture
      - name: Earlier native shape and image review regressions
        run: cargo test --locked -p cadcraft-ui-egui stage26 -- --nocapture
      - name: Stage270 exact intersection regressions
        run: cargo test --locked -p cadcraft-ui-egui stage270 -- --nocapture
      - name: Original AI Review and parser regressions
        run: cargo test --locked -p cadcraft-ui-egui stage25 -- --nocapture
      - name: Raster vectorizer native module regression
        run: cargo test --locked -p cadcraft-mcp raster -- --nocapture
