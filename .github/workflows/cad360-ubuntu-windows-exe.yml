name: CAD360 Windows EXE - Ubuntu Cross Fallback

on:
  push:
    branches: [tbt/cad360-active-release]
    paths:
      - 'installer/CAD360_TBT_Cross.nsi'
      - '.github/workflows/cad360-ubuntu-windows-exe.yml'
      - 'SOURCE_CAD_R65/**'
      - 'CAD360_WINDOWS_EXE_DELIVERY.md'
  workflow_dispatch:

permissions:
  contents: read

# Independent of queued GitHub Windows runners and independent of the original
# Windows Inno Setup build. Both may run for the same immutable commit.
concurrency:
  group: cad360-linux-winexe-${{ github.sha }}
  cancel-in-progress: false

jobs:
  cross-windows-exe:
    if: "${{ github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'build(cad360): B') }}"
    name: Cross-compile native Windows CAD360 EXE and NSIS Setup on Ubuntu
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      WINDOWS_TARGET: x86_64-pc-windows-msvc
      CARGO_PROFILE_RELEASE_LTO: "off"
      CARGO_BUILD_JOBS: "3"
      CAD360_BUILD_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - name: Install cross compilation and packaging tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends clang lld llvm cmake pkg-config nasm nsis zip unzip file
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.95.0'
          targets: x86_64-pc-windows-msvc
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/cargo-xwin
            ~/.cargo/registry/cache
            ~/.cargo/registry/index
            ~/.cache/cargo-xwin
          key: cargo-xwin-ubuntu-x64-0.22.0
      - name: Install Windows MSVC cross compiler
        shell: bash
        run: |
          set -euo pipefail
          if ! cargo xwin --version 2>/dev/null | grep -F '0.22.0'; then
            cargo install cargo-xwin --locked --version 0.22.0
          fi
          cargo xwin --version
      - name: Cross-compile real CAD360 desktop and CLI for Windows x64
        working-directory: SOURCE_CAD_R65
        shell: bash
        run: |
          set -euo pipefail
          cargo xwin build --release --locked --target x86_64-pc-windows-msvc -p cadcraft -p cadcraft-cli
          for bin in cadcraft cadcraft-cli; do
            path="target/x86_64-pc-windows-msvc/release/${bin}.exe"
            test -s "$path"
            test "$(stat -c %s "$path")" -gt 100000
            file "$path" | grep -F 'PE32+'
          done
      - name: Package real Windows installer portable ZIP source ZIP and SHA256
        shell: bash
        run: |
          set -euo pipefail
          build_dir="$(pwd)/SOURCE_CAD_R65/target/x86_64-pc-windows-msvc/release"
          mkdir -p dist/portable
          cp "$build_dir/cadcraft.exe" "$build_dir/cadcraft-cli.exe" dist/portable/
          printf 'CAD 360 Viet Nam - TBT Windows x64. Extract the whole ZIP, then run cadcraft.exe.\n' > dist/portable/README.txt
          (cd dist/portable && zip -q -r ../CAD360_VietNam_TBT_Portable.zip .)
          makensis -V2 -DAPP_BUILD_DIR="$build_dir" -DOUT_DIR="$(pwd)/dist" installer/CAD360_TBT_Cross.nsi
          git archive --format=zip --output=dist/CAD360_TBT_Source_R15_UI.zip HEAD SOURCE_CAD_R65 installer .github README.md
          unzip -p dist/CAD360_TBT_Source_R15_UI.zip SOURCE_CAD_R65/apps/cadcraft/src/bim_collab.rs | grep -F 'fn can_sync_from_dashboard'
          unzip -p dist/CAD360_TBT_Source_R15_UI.zip SOURCE_CAD_R65/apps/cadcraft/src/bim_collab.rs | grep -F 'DANH SÁCH THÀNH VIÊN'
          unzip -p dist/CAD360_TBT_Source_R15_UI.zip SOURCE_CAD_R65/apps/cadcraft/src/bim_collab.rs | grep -F 'fn collaboration_navigation'
          unzip -p dist/CAD360_TBT_Source_R15_UI.zip SOURCE_CAD_R65/apps/cadcraft/src/bim_collab.rs | grep -F 'fn collaboration_metrics_row'
          unzip -p dist/CAD360_TBT_Source_R15_UI.zip SOURCE_CAD_R65/apps/cadcraft/src/main.rs | grep -F 'option_env!("CAD360_BUILD_SHA")'
          unzip -p dist/CAD360_TBT_Source_R15_UI.zip SOURCE_CAD_R65/apps/cadcraft/src/bim_collab.rs | grep -F 'read(true).write(true).open(&backup_temp)'
          unzip -p dist/CAD360_TBT_Source_R15_UI.zip SOURCE_CAD_R65/crates/ui-egui/src/canvas/list.rs | grep -F 'fn cached_primitive_count'
          unzip -p dist/CAD360_TBT_Source_R15_UI.zip SOURCE_CAD_R65/crates/ui-egui/src/canvas/tests.rs | grep -F 'ix.cached_primitive_capacity()'
          unzip -p dist/CAD360_TBT_Source_R15_UI.zip SOURCE_CAD_R65/crates/ui-egui/src/quick.rs | grep -F 'qselect_matching_choices'
          unzip -p dist/CAD360_TBT_Source_R15_UI.zip SOURCE_CAD_R65/crates/ui-egui/src/quick.rs | grep -F 'qselect_large_layer_list_caps_rendered_rows_but_keeps_total'
          unzip -p dist/CAD360_TBT_Source_R15_UI.zip SOURCE_CAD_R65/crates/ui-egui/src/quick.rs | grep -F 'fn qselect_has_criteria'
          unzip -p dist/CAD360_TBT_Source_R15_UI.zip SOURCE_CAD_R65/crates/ui-egui/src/quick.rs | grep -F 'selection_hash'
          unzip -p dist/CAD360_TBT_Source_R15_UI.zip SOURCE_CAD_R65/crates/ui-egui/src/quick.rs | grep -F 'qselect_value_for_property'
          unzip -p dist/CAD360_TBT_Source_R15_UI.zip SOURCE_CAD_R65/crates/ui-egui/src/quick.rs | grep -F 'qselect_keeps_numeric_layer_zero_as_text'
          unzip -p dist/CAD360_TBT_Source_R15_UI.zip SOURCE_CAD_R65/crates/engine/src/cmd/qselect.rs | grep -F 'fn append_unique_handles'
          unzip -p dist/CAD360_TBT_Source_R15_UI.zip SOURCE_CAD_R65/crates/engine/src/cmd/qselect.rs | grep -F 'qselect_append_handles_large_selection_without_duplication'
          unzip -p dist/CAD360_TBT_Source_R15_UI.zip SOURCE_CAD_R65/apps/cadcraft/src/bim_sync.rs | grep -F 'duplicate-handle-in-batch'
          unzip -p dist/CAD360_TBT_Source_R15_UI.zip SOURCE_CAD_R65/crates/engine/src/cmd/qselect.rs | grep -F 'qselect_preview_counts_matching_objects_without_mutating_selection'
          unzip -p dist/CAD360_TBT_Source_R15_UI.zip SOURCE_CAD_R65/crates/ui-egui/src/quick.rs | grep -F 'preview_and_apply_share_exactly_the_same_filter_parameters'
          unzip -p dist/CAD360_TBT_Source_R15_UI.zip SOURCE_CAD_R65/crates/engine/src/cmd/qselect.rs | grep -F 'qselect_exclude_type_uses_complement_of_all_candidate_objects'
          unzip -p dist/CAD360_TBT_Source_R15_UI.zip SOURCE_CAD_R65/crates/ui-egui/src/quick.rs | grep -F 'append_preview_signature_changes_when_current_selection_changes'
          unzip -p dist/CAD360_TBT_Source_R15_UI.zip SOURCE_CAD_R65/crates/engine/src/cmd/qselect.rs | grep -F 'qselect_remove_subtracts_matching_entities_from_current_selection'
          unzip -p dist/CAD360_TBT_Source_R15_UI.zip SOURCE_CAD_R65/crates/ui-egui/src/quick.rs | grep -F 'Bỏ đối tượng phù hợp khỏi tập chọn hiện tại'
          unzip -p dist/CAD360_TBT_Source_R15_UI.zip SOURCE_CAD_R65/crates/engine/src/cmd/modify2/tests.rs | grep -F 'let path = h(&s.execute("line", &json!({"points": [[0, 0], [10, 0]]})).unwrap());'
          unzip -p dist/CAD360_TBT_Source_R15_UI.zip SOURCE_CAD_R65/crates/ui-egui/src/canvas.rs | grep -F 'tiny_mouse_noise_is_skipped_but_normal_cad_movement_is_immediate'
          unzip -p dist/CAD360_TBT_Source_R15_UI.zip SOURCE_CAD_R65/crates/ui-egui/src/lib.rs | grep -F 'i18n::Preference::Vietnamese'
          unzip -p dist/CAD360_TBT_Source_R15_UI.zip SOURCE_CAD_R65/crates/ui-egui/src/i18n/vi.tsv | grep -F 'Append to current selection set'
          unzip -p dist/CAD360_TBT_Source_R15_UI.zip SOURCE_CAD_R65/crates/engine/src/cmd/draw.rs | grep -F 'use cadcraft_doc::Handle;'
          for filename in CAD360_VietNam_TBT_Setup.exe CAD360_VietNam_TBT_Portable.zip CAD360_TBT_Source_R15_UI.zip; do
            test -s "dist/$filename"
          done
          file dist/CAD360_VietNam_TBT_Setup.exe | grep -F 'PE32'
          (cd dist && sha256sum CAD360_VietNam_TBT_Setup.exe CAD360_VietNam_TBT_Portable.zip CAD360_TBT_Source_R15_UI.zip > SHA256SUMS.txt)
          printf 'Commit=%s\nRunId=%s\nWindowsBuild=Ubuntu cargo-xwin x86_64-pc-windows-msvc\nInstaller=NSIS\nGUI_VERIFIED=false\nReleaseBatch=B27-RESPONSIVE-VI\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" > dist/BUILD_INFO.txt
          ls -lh dist/*.exe dist/*.zip dist/SHA256SUMS.txt
      - name: Upload actual Windows Setup EXE and portable bundle
        uses: actions/upload-artifact@v4
        with:
          name: CAD360-TBT-Windows-x64-Setup-Portable-Source-B27-RESPONSIVE-VI
          path: |
            dist/CAD360_VietNam_TBT_Setup.exe
            dist/CAD360_VietNam_TBT_Portable.zip
            dist/CAD360_TBT_Source_R15_UI.zip
            dist/SHA256SUMS.txt
            dist/BUILD_INFO.txt
          if-no-files-found: error
          retention-days: 30
      - name: Regression-test CAD QSELECT engine and UI after uploading installer
        working-directory: SOURCE_CAD_R65
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p cadcraft-engine cmd::qselect::tests -- --test-threads=2
          cargo test --locked -p cadcraft-ui-egui qselect_filter_tests -- --test-threads=2
      - name: Regression-test BIM collaboration after uploading the installer
        working-directory: SOURCE_CAD_R65
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p cadcraft --bin cadcraft bim_collab::tests -- --test-threads=2
