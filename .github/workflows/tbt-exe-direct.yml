name: TBT CAD360 Direct EXE Build

on:
  push:
    branches:
      - tbt/cad360-active-release
  workflow_dispatch:
    inputs:
      batch_count:
        description: "Số lượt thay đổi kể từ lần đóng gói trước (15-30)"
        required: true
        type: number
        default: 15

permissions:
  contents: write

# Preserve each requested 15-30 batch milestone build while development continues.
# A new source commit must not cancel an already-started Windows installer.
concurrency:
  group: cad360-direct-exe-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  source-preflight:
    # Normal development commits only update source; no packaging or inventory
    # runner is needed until an intentional 15-30 change milestone.
    if: "${{ github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'build(cad360): B') || startsWith(github.event.head_commit.message, 'release(cad360): B') }}"
    name: Validate Git checkout and source inventory
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate tracked build inputs
        shell: bash
        run: |
          set -euo pipefail
          for file in SOURCE_CAD_R65/Cargo.toml SOURCE_CAD_R65/Cargo.lock SOURCE_CAD_R65/apps/cadcraft/src/main.rs SOURCE_CAD_R65/apps/cadcraft-cli/Cargo.toml installer/CAD360_TBT_Windows.iss; do
            test -s "$file" || { echo "::error::Missing required build input: $file"; exit 1; }
          done
          printf 'commit=%s\n' "$GITHUB_SHA" > TBT_SOURCE_INVENTORY.txt
          printf 'tracked_files=%s\n' "$(git ls-files | wc -l)" >> TBT_SOURCE_INVENTORY.txt
          printf 'rust_files=%s\n' "$(git ls-files '*.rs' | wc -l)" >> TBT_SOURCE_INVENTORY.txt
          printf 'cargo_manifests=%s\n' "$(git ls-files '**/Cargo.toml' | wc -l)" >> TBT_SOURCE_INVENTORY.txt
          cat TBT_SOURCE_INVENTORY.txt
      - uses: actions/upload-artifact@v4
        with:
          name: TBT-Source-Inventory
          path: TBT_SOURCE_INVENTORY.txt
          if-no-files-found: error

  source-archive:
    name: Package downloadable source ZIP immediately
    needs: source-preflight
    if: "${{ github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'build(cad360): B') || startsWith(github.event.head_commit.message, 'release(cad360): B') }}"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Package source at the exact milestone commit
        shell: bash
        env:
          MESSAGE: ${{ github.event.head_commit.message }}
          MANUAL_BATCH_COUNT: ${{ inputs.batch_count }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            count="$MANUAL_BATCH_COUNT"
          else
            [[ "$MESSAGE" =~ ^(release|build)\(cad360\):\ B([0-9]{2}) ]] || { echo "::error::Invalid milestone commit"; exit 1; }
            count="${BASH_REMATCH[2]}"
          fi
          count=$((10#$count))
          ((count >= 15 && count <= 30)) || { echo "::error::Batch count outside 15..30"; exit 1; }
          label=$(printf 'R%02d' "$count")
          mkdir -p dist
          git archive --format=zip --output="dist/CAD360_TBT_Source_${label}.zip" HEAD SOURCE_CAD_R65 installer .github README.md
          test -s "dist/CAD360_TBT_Source_${label}.zip"
          (cd dist && sha256sum "CAD360_TBT_Source_${label}.zip" > SOURCE_SHA256SUMS.txt)
          printf 'Commit=%s\nRunId=%s\nStatus=SOURCE_ONLY_WINDOWS_EXE_PENDING\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" > dist/SOURCE_BUILD_INFO.txt
      - uses: actions/upload-artifact@v4
        with:
          name: CAD360-TBT-Source-ZIP-Independent-of-Windows
          path: |
            dist/CAD360_TBT_Source_R*.zip
            dist/SOURCE_SHA256SUMS.txt
            dist/SOURCE_BUILD_INFO.txt
          if-no-files-found: error
          retention-days: 30

  build-exe:
    if: "${{ (github.event_name == 'workflow_dispatch') || (github.event_name == 'push' && (startsWith(github.event.head_commit.message, 'release(cad360): B') || startsWith(github.event.head_commit.message, 'build(cad360): B'))) }}"
    needs: source-preflight
    name: TBT CAD360 Windows Setup
    runs-on: windows-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: SOURCE_CAD_R65
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.95.0'
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: SOURCE_CAD_R65
      - name: Enforce packaging cadence 15 to 30 batches
        shell: pwsh
        env:
          RELEASE_MESSAGE: ${{ github.event.head_commit.message }}
          MANUAL_BATCH_COUNT: ${{ inputs.batch_count }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch') {
            $batchCount = [int]$env:MANUAL_BATCH_COUNT
          } else {
            $match = [regex]::Match($env:RELEASE_MESSAGE, '^(release|build)[(]cad360[)]: B([0-9]{2})')
            if (!$match.Success) { throw 'Commit must start with release(cad360): B15..B30 or build(cad360): B15..B30' }
            $batchCount = [int]$match.Groups[2].Value
          }
          if ($batchCount -lt 15 -or $batchCount -gt 30) { throw 'Packaging is only allowed after 15-30 implementation batches' }
          "CAD360_RELEASE_LABEL=R$('{0:D2}' -f $batchCount)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Preflight real build environment and source inputs
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $report = Join-Path $env:GITHUB_WORKSPACE 'TBT_BUILD_PREFLIGHT.txt'
          $checks = @(
            'Cargo.toml',
            'Cargo.lock',
            'apps/cadcraft/Cargo.toml',
            'apps/cadcraft/src/main.rs',
            'apps/cadcraft-cli/Cargo.toml',
            'crates/ui-egui/src/i18n/vi.tsv',
            'assets/app-icon/tbt360.ico',
            '../installer/CAD360_TBT_Windows.iss'
          )
          @(
            "Commit: $env:GITHUB_SHA",
            "OS: $([Environment]::OSVersion.VersionString)",
            "Rust: $(rustc --version)",
            "Cargo: $(cargo --version)",
            "Workspace: $(Get-Location)"
          ) | Set-Content $report
          $missing = @()
          foreach ($item in $checks) {
            if (!(Test-Path $item -PathType Leaf)) {
              $missing += $item
              "MISSING: $item" | Add-Content $report
            } else {
              $size = (Get-Item $item).Length
              "PRESENT: $item ($size bytes)" | Add-Content $report
              if ($size -eq 0) { $missing += $item }
            }
          }
          $tracked = @(git ls-files | Where-Object { $_ }).Count
          $rustFiles = @(git ls-files '*.rs' | Where-Object { $_ }).Count
          $cargoFiles = @(git ls-files '*Cargo.toml' | Where-Object { $_ }).Count
          "Tracked workspace files: $tracked" | Add-Content $report
          "Rust files: $rustFiles" | Add-Content $report
          "Cargo manifests: $cargoFiles" | Add-Content $report
          if ($LASTEXITCODE -ne 0 -or $tracked -eq 0 -or $rustFiles -eq 0 -or $cargoFiles -eq 0) {
            throw 'Repository checkout is empty or incomplete'
          }
          if ($missing.Count -gt 0) { throw "Missing or empty required files: $($missing -join ', ')" }
          cargo metadata --locked --offline --no-deps --format-version 1 | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'Cargo manifest/lockfile verification failed' }
          Get-Content $report | Write-Host
      - name: Upload build preflight report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TBT-Build-Preflight
          path: TBT_BUILD_PREFLIGHT.txt
          if-no-files-found: warn
          retention-days: 30
      - name: Build CAD360 native release
        run: cargo build --release --locked -p cadcraft -p cadcraft-cli
      - name: Verify native binaries
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($bin in @('cadcraft.exe', 'cadcraft-cli.exe')) {
            $file = "target/release/$bin"
            if (!(Test-Path $file)) { throw "Missing $file" }
            if ((Get-Item $file).Length -lt 100000) { throw "Incomplete $file" }
          }
      - name: Install Inno Setup
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6/ISCC.exe'
          if (!(Test-Path $iscc)) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'Could not install Inno Setup' }
          }
          if (!(Test-Path $iscc)) { throw 'ISCC.exe missing' }
      - name: Compile TBT installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6/ISCC.exe'
          & $iscc '/Qp' '../installer/CAD360_TBT_Windows.iss'
          if ($LASTEXITCODE -ne 0) { throw 'Installer compilation failed' }
          $setup = '../dist/CAD360_VietNam_TBT_Setup.exe'
          if (!(Test-Path $setup)) { throw 'Setup EXE was not generated' }
          if ((Get-Item $setup).Length -lt 100000) { throw 'Setup EXE too small' }
          $hash = (Get-FileHash -Algorithm SHA256 -Path $setup).Hash.ToLowerInvariant()
          "$hash  CAD360_VietNam_TBT_Setup.exe" | Set-Content -Encoding ascii '../dist/SHA256SUMS.txt'
      - name: Upload TBT Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: CAD360-VietNam-TBT-Setup-x64
          path: |
            dist/CAD360_VietNam_TBT_Setup.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
      - name: Build milestone source archive
        if: "${{ github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'release(cad360): B') || startsWith(github.event.head_commit.message, 'build(cad360): B') }}"
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $label = $env:CAD360_RELEASE_LABEL
          if ($label -notmatch '^R(1[5-9]|2[0-9]|30)$') { throw 'Invalid release label' }
          $sourceArchive = "../dist/CAD360_TBT_Source_$label.zip"
          Push-Location $env:GITHUB_WORKSPACE
          git archive --format=zip --output="dist/CAD360_TBT_Source_$label.zip" HEAD SOURCE_CAD_R65 installer .github README.md
          $archiveExitCode = $LASTEXITCODE
          Pop-Location
          if ($archiveExitCode -ne 0) { throw 'Cannot archive milestone sources' }
          if (!(Test-Path $sourceArchive)) { throw 'Source ZIP missing' }
      - name: Package 15-30 batch candidate bundle
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = '../dist'
          $label = $env:CAD360_RELEASE_LABEL
          $portableDir = Join-Path $root "CAD360_TBT_Portable_$label"
          New-Item -ItemType Directory -Force -Path $portableDir | Out-Null
          foreach ($name in @('cadcraft.exe', 'cadcraft-cli.exe')) {
            Copy-Item "target/release/$name" (Join-Path $portableDir $name) -Force
          }
          Set-Content -Encoding utf8 (Join-Path $portableDir 'README.txt') 'CAD 360 Viet Nam - TBT Portable Windows x64. Extract all files before running cadcraft.exe.'
          $portable = Join-Path $root 'CAD360_VietNam_TBT_Portable.zip'
          if (Test-Path $portable) { Remove-Item $portable -Force }
          Compress-Archive -Path "$portableDir/*" -DestinationPath $portable
          $setup = Join-Path $root 'CAD360_VietNam_TBT_Setup.exe'
          $source = Join-Path $root "CAD360_TBT_Source_$label.zip"
          $manifest = Join-Path $root 'SHA256SUMS.txt'
          @($setup, $portable, $source) | ForEach-Object {
            if (!(Test-Path $_) -or (Get-Item $_).Length -lt 10000) { throw "Missing or incomplete candidate file: $_" }
            $hash = (Get-FileHash -Algorithm SHA256 -Path $_).Hash.ToLowerInvariant()
            "$hash  $(Split-Path $_ -Leaf)"
          } | Set-Content -Encoding ascii $manifest
          if ((Get-Content $manifest).Count -ne 3) { throw 'Candidate checksum manifest must contain 3 files' }
          foreach ($name in @('CAD360_VietNam_TBT_Setup.exe', 'CAD360_VietNam_TBT_Portable.zip', "CAD360_TBT_Source_$label.zip")) {
            $file = Join-Path $root $name
            $actual = (Get-FileHash -Algorithm SHA256 -Path $file).Hash.ToLowerInvariant()
            if (!(Get-Content $manifest | Where-Object { $_ -eq "$actual  $name" })) { throw "SHA256 mismatch: $name" }
          }
          @(
            "Commit=$env:GITHUB_SHA"
            "RunId=$env:GITHUB_RUN_ID"
            "Ref=$env:GITHUB_REF"
            'Status=UNVERIFIED_GUI_CANDIDATE'
          ) | Set-Content -Encoding utf8 (Join-Path $root 'BUILD_INFO.txt')
      - name: Upload complete Windows candidate bundle
        uses: actions/upload-artifact@v4
        with:
          name: CAD360_TBT_B15_B30_Setup_Portable_Source_Candidate
          path: |
            dist/CAD360_VietNam_TBT_Setup.exe
            dist/CAD360_VietNam_TBT_Portable.zip
            dist/CAD360_TBT_Source_R*.zip
            dist/SHA256SUMS.txt
            dist/BUILD_INFO.txt
          if-no-files-found: error
          retention-days: 30
      - name: Validate BIM conflict and revision regression tests after candidate artifact
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cargo test --locked -p cadcraft --bin cadcraft bim_collab::tests -- --test-threads=2
          if ($LASTEXITCODE -ne 0) { throw 'BIM collaboration regression tests failed; candidate artifact is UNVERIFIED_GUI_CANDIDATE and must not be called a validated release' }
      - name: Publish validated Windows milestone release
        if: "${{ github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'release(cad360): B') }}"
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $label = $env:CAD360_RELEASE_LABEL
          if ($label -notmatch '^R(1[5-9]|2[0-9]|30)$') { throw 'Invalid release label' }
          $tag = "cad360-$($label.ToLowerInvariant())"
          $setup = '../dist/CAD360_VietNam_TBT_Setup.exe'
          $checksum = '../dist/SHA256SUMS.txt'
          $source = "../dist/CAD360_TBT_Source_$label.zip"
          foreach ($file in @($setup, $checksum, $source)) {
            if (!(Test-Path $file)) { throw "Missing release file: $file" }
          }
          $portable = '../dist/CAD360_VietNam_TBT_Portable.zip'
          gh release create $tag $setup $portable $checksum $source --target $env:GITHUB_SHA --title "CAD360 TBT $label - Windows x64" --notes "Windows setup built from source commit $env:GITHUB_SHA, validated by BIM tests and build gates. Source archive and SHA256SUMS included." --latest
          if ($LASTEXITCODE -ne 0) { throw 'Publishing GitHub release failed' }
