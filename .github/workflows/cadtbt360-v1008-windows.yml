name: CADTBT360 V1.008 Windows EXE
on:
  workflow_dispatch:
  push:
    branches:
      - release/CADTBT360_V1.008
    paths:
      - 'CADTBT360_V1.000/**'
      - '.github/workflows/cadtbt360-v1008-windows.yml'
jobs:
  windows-x64:
    runs-on: windows-latest
    permissions:
      contents: read
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout release sources
        uses: actions/checkout@v4
      - name: Install Rust 1.95 stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.95.0'
      - name: Cache Cargo downloads and compilation
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: CADTBT360_V1.000
          key: cadtbt360-v1008-win-x64
      - name: Verify locked Cargo workspace metadata
        working-directory: CADTBT360_V1.000
        run: cargo metadata --locked --no-deps --format-version 1 | Out-Null
      - name: Check road takeoff logic tests
        working-directory: CADTBT360_V1.000
        run: cargo test --locked -p cadcraft --bin cadcraft takeoff_road::tests -- --nocapture
      - name: Check station matching and QTO integration tests
        working-directory: CADTBT360_V1.000
        run: cargo test --locked -p cadcraft --bin cadcraft road_station_matching_tests -- --nocapture
      - name: Compile Windows desktop application with embedded Git SHA
        working-directory: CADTBT360_V1.000
        env:
          CAD360_BUILD_SHA: ${{ github.sha }}
          CADCRAFT_BUILD_SHA: ${{ github.sha }}
        run: cargo build --locked --release -p cadcraft --bin cadcraft
      - name: Prepare portable EXE
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $source = 'CADTBT360_V1.000/target/release/cadcraft.exe'
          if (!(Test-Path $source)) { throw "No compiled cadcraft.exe found at $source" }
          Copy-Item $source 'dist/CADTBT360_V1.008.exe'
          Compress-Archive -Path 'dist/CADTBT360_V1.008.exe' -DestinationPath 'dist/CADTBT360_V1.008_Portable.zip' -Force
      - name: Verify portable Windows artifact before installing
        run: |
          $ErrorActionPreference = 'Stop'
          $portable = 'dist/CADTBT360_V1.008.exe'
          if (!(Test-Path $portable)) { throw "Missing Windows executable" }
          $info = Get-Item $portable
          if ($info.Length -lt 1048576) { throw "Suspiciously small executable: $($info.Length) bytes" }
          $bytes = [System.IO.File]::ReadAllBytes((Resolve-Path $portable))
          if ([Text.Encoding]::ASCII.GetString($bytes, 0, 2) -ne 'MZ') { throw 'Not a Windows PE executable' }
          if ((Get-Item 'dist/CADTBT360_V1.008_Portable.zip').Length -lt 1048576) { throw 'Portable ZIP missing or too small' }
          Write-Host "PE verified: $portable ($($info.Length) bytes)"
      - name: Upload portable executable immediately after successful build
        uses: actions/upload-artifact@v4
        with:
          name: CADTBT360_V1.008_Portable_Windows_x64
          path: |
            dist/CADTBT360_V1.008.exe
            dist/CADTBT360_V1.008_Portable.zip
          if-no-files-found: error
          retention-days: 30
      - name: Create Windows setup EXE with Inno Setup
        run: |
          $ErrorActionPreference = 'Stop'
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) {
            choco install innosetup -y --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'Inno Setup installation failed' }
          }
          if (!(Test-Path $iscc)) { throw 'Inno Setup compiler not found' }
          $script = @'
          [Setup]
          AppId={{6BCA4011-C394-4C3D-AB6D-3D8D5A0B1000}
          AppName=CAD TBT 360
          AppVersion=1.0.8
          AppVerName=CAD TBT 360 V1.008
          DefaultDirName={autopf}\CAD TBT 360
          DefaultGroupName=CAD TBT 360
          OutputDir=dist
          OutputBaseFilename=CADTBT360_V1.008_Setup
          Compression=lzma
          SolidCompression=yes
          ArchitecturesAllowed=x64compatible
          ArchitecturesInstallIn64BitMode=x64compatible
          UninstallDisplayName=CAD TBT 360 V1.008
          [Files]
          Source: "dist\CADTBT360_V1.008.exe"; DestDir: "{app}"; Flags: ignoreversion
          [Icons]
          Name: "{autoprograms}\CAD TBT 360"; Filename: "{app}\CADTBT360_V1.008.exe"
          Name: "{autodesktop}\CAD TBT 360"; Filename: "{app}\CADTBT360_V1.008.exe"; Tasks: desktopicon
          [Tasks]
          Name: "desktopicon"; Description: "Tạo biểu tượng màn hình"; GroupDescription: "Biểu tượng:"
          [Run]
          Filename: "{app}\CADTBT360_V1.008.exe"; Description: "Mở CAD TBT 360"; Flags: nowait postinstall skipifsilent
          '@
          Set-Content -Path 'CADTBT360_V1.008.iss' -Value $script -Encoding UTF8
          & $iscc 'CADTBT360_V1.008.iss'
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup failed' }
          if (!(Test-Path 'dist/CADTBT360_V1.008_Setup.exe')) { throw 'Setup EXE missing' }
      - name: Generate SHA256 checksums
        run: |
          $ErrorActionPreference = 'Stop'
          $files = @('dist/CADTBT360_V1.008.exe','dist/CADTBT360_V1.008_Portable.zip','dist/CADTBT360_V1.008_Setup.exe')
          $checksums = foreach ($file in $files) {
            if (!(Test-Path $file)) { throw "Missing required package: $file" }
            $hash = (Get-FileHash -Path $file -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $(Split-Path $file -Leaf)"
          }
          Set-Content -Path 'dist/CADTBT360_V1.008_SHA256.txt' -Value $checksums -Encoding ascii
      - name: Upload Windows setup and complete SHA256 manifest
        uses: actions/upload-artifact@v4
        with:
          name: CADTBT360_V1.008_Setup_Windows_x64
          path: |
            dist/CADTBT360_V1.008.exe
            dist/CADTBT360_V1.008_Portable.zip
            dist/CADTBT360_V1.008_Setup.exe
            dist/CADTBT360_V1.008_SHA256.txt
          if-no-files-found: error
          retention-days: 30
