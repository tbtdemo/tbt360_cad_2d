name: CAD 360 V1.025 - Desktop Reliability

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'CADTBT360_V1.000/crates/ui-egui/src/autosave.rs'
      - 'CADTBT360_V1.000/crates/engine/src/autosave.rs'
      - 'CADTBT360_V1.000/crates/engine/tests/autosave.rs'
      - 'CADTBT360_V1.000/crates/engine/src/cmd/image.rs'
      - 'CADTBT360_V1.000/crates/mcp/src/tools.rs'
      - 'CADTBT360_V1.000/crates/mcp/src/tests.rs'
      - '.github/workflows/cad360-v1025-desktop-reliability.yml'
  push:
    branches:
      - feature/CADTBT360_V1.025_xref-regression
    paths:
      - 'CADTBT360_V1.000/crates/ui-egui/src/autosave.rs'
      - 'CADTBT360_V1.000/crates/engine/src/autosave.rs'
      - 'CADTBT360_V1.000/crates/engine/tests/autosave.rs'
      - 'CADTBT360_V1.000/crates/engine/src/cmd/image.rs'
      - 'CADTBT360_V1.000/crates/mcp/src/tools.rs'
      - 'CADTBT360_V1.000/crates/mcp/src/tests.rs'
      - '.github/workflows/cad360-v1025-desktop-reliability.yml'

permissions:
  contents: read

jobs:
  recovery-ui:
    name: Build and regression test desktop recovery UI
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: CADTBT360_V1.000
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: CADTBT360_V1.000
          key: cad360-v1025-desktop
      - name: Validate scheduled autosave, crash recovery and newest-first ordering
        run: |
          cargo test --locked -p cadcraft-engine --test autosave -- --nocapture
          if ($LASTEXITCODE -ne 0) { throw 'Engine autosave and recovery regression failure' }
      - name: Verify AI-compatible raster tracing draws real CAD geometry
        run: |
          cargo test --locked -p cadcraft-engine --lib imagetrace_maps_image_pixels_into_editable_cad_geometry -- --nocapture
          if ($LASTEXITCODE -ne 0) { throw 'Image raster trace regression failed' }
          cargo test --locked -p cadcraft-engine --lib imagecalibrate_two_points_previews_then_places_image_without_changing_pixel_geometry -- --nocapture
          if ($LASTEXITCODE -ne 0) { throw 'Two-point image calibration regression failed' }
          cargo test --locked -p cadcraft-engine --lib imagecalibratefit_uses_four_controls_and_refuses_bad_residual_without_edit -- --nocapture
          if ($LASTEXITCODE -ne 0) { throw 'Image pixel-to-CAD vector tracing failed' }
      - name: Verify AI agent can draw over images using MCP
        run: |
          cargo test --locked -p cadcraft-mcp --lib agent_traces_an_image_into_editable_cad_via_mcp -- --nocapture
          if ($LASTEXITCODE -ne 0) { throw 'MCP image tracing regression failed' }
          cargo test --locked -p cadcraft-mcp --lib agent_calibrates_image_before_tracing_using_two_control_points -- --nocapture
          if ($LASTEXITCODE -ne 0) { throw 'Two-point MCP image calibration regression failed' }
          cargo test --locked -p cadcraft-mcp --lib agent_fits_four_survey_controls_before_drawing_on_image -- --nocapture
          if ($LASTEXITCODE -ne 0) { throw 'MCP raster image tracing regression failed' }
      - name: Compile UI and run Drawing Recovery unit tests
        run: |
          cargo test --locked -p cadcraft-ui-egui --lib autosave::tests -- --nocapture
          if ($LASTEXITCODE -ne 0) { throw 'Desktop autosave recovery tests failed' }
      - name: Compile Windows CAD desktop executable
        run: |
          cargo check --locked -p cadcraft --bin cadcraft
          if ($LASTEXITCODE -ne 0) { throw 'Desktop CAD compile failed' }
