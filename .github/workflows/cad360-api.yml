name: CAD360 Collaboration API Build
on:
  push:
    branches: ['feat/cad360-server-write-gate-*']
    paths:
      - 'backend/api/**'
      - '.github/workflows/cad360-api.yml'
  workflow_dispatch:
jobs:
  build-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore packages
        run: dotnet restore backend/api/Cad360.Collaboration.Api/Cad360.Collaboration.Api.csproj
      - name: Compile authenticated collaboration API
        run: dotnet build backend/api/Cad360.Collaboration.Api/Cad360.Collaboration.Api.csproj -c Release --no-restore --warnaserror
      - name: Verify anonymous HTTP requests are rejected
        shell: bash
        env:
          Auth__Authority: https://issuer.example.invalid
          Auth__Audience: cad360-api
          ConnectionStrings__Cad360: Host=localhost;Port=5432;Database=cad360;Username=smoke;Password=smoke
          ASPNETCORE_URLS: http://127.0.0.1:5079
        run: |
          set -euo pipefail
          dotnet run --project backend/api/Cad360.Collaboration.Api/Cad360.Collaboration.Api.csproj -c Release --no-build --no-launch-profile > /tmp/cad360-api.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true; cat /tmp/cad360-api.log' EXIT
          ready=0
          for i in $(seq 1 40); do
            status=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:5079/api/bim/projects/11111111-1111-1111-1111-111111111111/changes?afterRevision=0 || true)
            if [ "$status" = 401 ]; then ready=1; break; fi
            sleep 1
          done
          if [ "$ready" != 1 ]; then echo 'Anonymous GET did not return HTTP 401'; exit 1; fi
          status=$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/json' -d '{"objectId":"22222222-2222-2222-2222-222222222222","floorId":"33333333-3333-3333-3333-333333333333","discipline":"ARCH","sourceHandle":"A1","entityType":"LINE","geometry":{}}' http://127.0.0.1:5079/api/bim/projects/11111111-1111-1111-1111-111111111111/objects)
          test "$status" = 401 || { echo "Anonymous POST returned $status, expected 401"; exit 1; }
          status=$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/json' -d '{"batchId":"11111111-1111-1111-1111-111111111111","items":[]}' http://127.0.0.1:5079/api/bim/projects/11111111-1111-1111-1111-111111111111/changesets)
          test "$status" = 401 || { echo "Anonymous changeset returned $status, expected 401"; exit 1; }
          status=$(curl -s -o /dev/null -w '%{http_code}' -X PUT -H 'Content-Type: application/json' -d '{"expectedRevision":1,"geometry":{}}' http://127.0.0.1:5079/api/bim/projects/11111111-1111-1111-1111-111111111111/objects/22222222-2222-2222-2222-222222222222)
          test "$status" = 401 || { echo "Anonymous UPDATE returned $status, expected 401"; exit 1; }
          status=$(curl -s -o /dev/null -w '%{http_code}' -X DELETE 'http://127.0.0.1:5079/api/bim/projects/11111111-1111-1111-1111-111111111111/objects/22222222-2222-2222-2222-222222222222?expectedRevision=1')
          test "$status" = 401 || { echo "Anonymous DELETE returned $status, expected 401"; exit 1; }

          for endpoint in \
            'http://127.0.0.1:5079/api/bim/projects/11111111-1111-1111-1111-111111111111/changes?afterRevision=0' \
            'http://127.0.0.1:5079/api/bim/projects/11111111-1111-1111-1111-111111111111/changes?afterRevision=1'; do
            status=$(curl -s -o /dev/null -w '%{http_code}' -H 'Authorization: Bearer invalid.for.testing' "$endpoint")
            test "$status" = 401 || { echo "Invalid bearer returned $status, expected 401"; exit 1; }
          done
          status=$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Authorization: Bearer invalid.for.testing' -H 'Content-Type: application/json' -d '{"batchId":"11111111-1111-1111-1111-111111111111","items":[]}' http://127.0.0.1:5079/api/bim/projects/11111111-1111-1111-1111-111111111111/changesets)
          test "$status" = 401 || { echo "Invalid bearer changeset returned $status, expected 401"; exit 1; }

