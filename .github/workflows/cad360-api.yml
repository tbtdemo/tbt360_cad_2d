name: CAD360 Collaboration API Build
on:
  push:
    branches: ['feat/cad360-server-write-gate-*']
    paths:
      - 'backend/api/**'
      - '.github/workflows/cad360-api.yml'
  workflow_dispatch:
jobs:
  build-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore packages
        run: dotnet restore backend/api/Cad360.Collaboration.Api/Cad360.Collaboration.Api.csproj
      - name: Compile authenticated collaboration API
        run: dotnet build backend/api/Cad360.Collaboration.Api/Cad360.Collaboration.Api.csproj -c Release --no-restore --warnaserror
