name: CAD 360 V1.025 - Windows GUI Startup Smoke

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Exact V1.025 prerelease tag to test (no recompilation)'
        required: true
        default: 'CADTBT360_V1.025_B87_A1'
        type: string
  push:
    branches:
      - feature/CADTBT360_V1.025_xref-regression
    paths:
      - '.github/workflows/cad360-v1025-gui-startup-smoke.yml'
      - 'scripts/qa/Test-CADTBT360-V1025-GuiStartup.ps1'

permissions:
  contents: read

concurrency:
  group: cad360-v1025-gui-smoke-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gui-startup:
    name: Verify released V1.025 Portable and Setup GUI startup on Windows
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      CAD360_RELEASE_TAG: ${{ inputs.release_tag || 'CADTBT360_V1.025_B87_A1' }}
    steps:
      - name: Require V1.025 feature branch for manual QA
        if: ${{ github.event_name == 'workflow_dispatch' }}
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -ne 'refs/heads/feature/CADTBT360_V1.025_xref-regression') {
            throw "Select feature/CADTBT360_V1.025_xref-regression in Run workflow (current ref: $env:GITHUB_REF)"
          }

      - name: Checkout QA script at current commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Preflight PowerShell GUI smoke script syntax
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $scriptPath = './scripts/qa/Test-CADTBT360-V1025-GuiStartup.ps1'
          if (!(Test-Path $scriptPath)) { throw "Missing GUI smoke script: $scriptPath" }
          $tokens = $null
          $parseErrors = $null
          $null = [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $scriptPath).Path, [ref]$tokens, [ref]$parseErrors)
          if ($null -ne $parseErrors -and $parseErrors.Count -gt 0) {
            $parseErrors | ForEach-Object { Write-Host "::error::$($_.Message) at line $($_.Extent.StartLineNumber)" }
            throw "GUI smoke PowerShell script contains $($parseErrors.Count) syntax errors"
          }
          Write-Host 'PowerShell GUI startup script syntax validated'

      - name: Resolve exact prerelease identity and SHA256 manifest
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = $env:CAD360_RELEASE_TAG
          if ($tag -notmatch '^CADTBT360_V1[.]025_B[0-9]+_A[0-9]+        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force dist/gui-smoke | Out-Null
          gh release download $env:CAD360_RELEASE_TAG --repo tbtdemo/tbt360_cad_2d --pattern 'CADTBT360_V1.025_Portable_Windows_x64.zip' --dir dist/gui-smoke --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Cannot download B87 A1 Portable from GitHub Release' }
          $zip = 'dist/gui-smoke/CADTBT360_V1.025_Portable_Windows_x64.zip'
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          $assetName = 'CADTBT360_V1.025_Portable_Windows_x64.zip'
          $line = @(Get-Content 'dist/gui-smoke/SHA256SUMS.txt' | Where-Object { $_ -match ('^[0-9a-fA-F]{64}  ' + [regex]::Escape($assetName) + '
          if ($hash -ne $expected) { throw "Downloaded Portable SHA256 mismatch: $hash" }
          Expand-Archive -Path $zip -DestinationPath 'dist/gui-smoke/portable' -Force
          $exe = 'dist/gui-smoke/portable/CADTBT360.exe'
          if (!(Test-Path $exe)) { throw 'CADTBT360.exe missing in official Portable ZIP' }
          $info = Get-Content 'dist/gui-smoke/portable/BUILD_INFO.txt'
          if (($info -join [char]10) -ne ((Get-Content 'dist/gui-smoke/BUILD_INFO.txt') -join [char]10)) { throw 'Portable BUILD_INFO does not match release identity manifest' }
          $hash | Set-Content 'dist/gui-smoke/portable-sha256.txt' -Encoding ascii

      - name: Start real Windows GUI and observe top-level window
        id: portable_gui
        continue-on-error: true
        shell: pwsh
        run: |
          & './scripts/qa/Test-CADTBT360-V1025-GuiStartup.ps1' -Executable './dist/gui-smoke/portable/CADTBT360.exe' -EvidenceDirectory './dist/gui-smoke/evidence' -WaitSeconds 35

      - name: Download and verify requested V1.025 Setup executable
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          gh release download $env:CAD360_RELEASE_TAG --repo tbtdemo/tbt360_cad_2d --pattern 'CADTBT360_V1.025_Setup_Windows_x64.exe' --dir dist/gui-smoke --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Cannot download B87 A1 Setup EXE' }
          $setup = 'dist/gui-smoke/CADTBT360_V1.025_Setup_Windows_x64.exe'
          $hash = (Get-FileHash $setup -Algorithm SHA256).Hash.ToLowerInvariant()
          $assetName = 'CADTBT360_V1.025_Setup_Windows_x64.exe'
          $line = @(Get-Content 'dist/gui-smoke/SHA256SUMS.txt' | Where-Object { $_ -match ('^[0-9a-fA-F]{64}  ' + [regex]::Escape($assetName) + '
          $hash | Set-Content 'dist/gui-smoke/setup-sha256.txt' -Encoding ascii

      - name: Install requested Setup and verify installed GUI identity
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = (Resolve-Path 'dist/gui-smoke/CADTBT360_V1.025_Setup_Windows_x64.exe').Path
          $dest = Join-Path $env:RUNNER_TEMP 'CADTBT360 V1025 GUI Acceptance'
          $dirArg = '/DIR="{0}"' -f $dest
          $p = Start-Process -FilePath $setup -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', $dirArg) -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "Setup exit code $($p.ExitCode)" }
          $installedGui = Join-Path $dest 'CADTBT360.exe'
          if (!(Test-Path $installedGui)) { throw 'Installed GUI executable absent' }
          $sourceHash = (Get-FileHash 'dist/gui-smoke/portable/CADTBT360.exe' -Algorithm SHA256).Hash
          $installedHash = (Get-FileHash $installedGui -Algorithm SHA256).Hash
          if ($sourceHash -ne $installedHash) { throw 'Installed GUI executable differs from B87 A1 Portable binary' }
          $info = Get-Content (Join-Path $dest 'BUILD_INFO.txt')
          if (($info -join [char]10) -ne ((Get-Content 'dist/gui-smoke/BUILD_INFO.txt') -join [char]10)) { throw 'Installed GUI source commit mismatch' }
          $dest | Set-Content 'dist/gui-smoke/installed-directory.txt'

      - name: Start installed Setup GUI and observe top-level window
        id: installed_gui
        continue-on-error: true
        shell: pwsh
        run: |
          $dest = Get-Content 'dist/gui-smoke/installed-directory.txt' -Raw
          & './scripts/qa/Test-CADTBT360-V1025-GuiStartup.ps1' -Executable (Join-Path $dest.Trim() 'CADTBT360.exe') -EvidenceDirectory './dist/gui-smoke/installed-evidence' -WaitSeconds 35

      - name: Uninstall requested Setup on Windows runner
        if: ${{ always() }}
        shell: pwsh
        run: |
          $destFile = 'dist/gui-smoke/installed-directory.txt'
          if (Test-Path $destFile) {
            $dest = (Get-Content $destFile -Raw).Trim()
            $uninstaller = Join-Path $dest 'unins000.exe'
            if (Test-Path $uninstaller) {
              $p = Start-Process -FilePath $uninstaller -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART') -Wait -PassThru
              if ($p.ExitCode -ne 0) { throw "Setup uninstaller failed with exit $($p.ExitCode)" }
            }
          }

      - name: Report startup acceptance gate for both package types
        if: ${{ always() }}
        shell: pwsh
        env:
          PORTABLE_OUTCOME: ${{ steps.portable_gui.outcome }}
          INSTALLED_OUTCOME: ${{ steps.installed_gui.outcome }}
        run: |
          $ErrorActionPreference = 'Stop'
          $summary = @(
            "## CAD 360 V1.025 $env:CAD360_RELEASE_TAG - Windows GUI startup results",
            "- Portable GUI startup: $env:PORTABLE_OUTCOME",
            "- Installed Setup GUI startup: $env:INSTALLED_OUTCOME",
            '- GUI manual acceptance: NOT_VERIFIED',
            '- AutoCAD independent DWG interoperability: NOT_VERIFIED'
          )
          $summary | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          $summary | ForEach-Object { Write-Host $_ }
          if ($env:PORTABLE_OUTCOME -ne 'success' -or $env:INSTALLED_OUTCOME -ne 'success') {
            throw 'V1.025 GUI startup gate did not pass for both Portable and Setup; inspect uploaded evidence.'
          }

      - name: Upload actual GUI startup evidence even on failure
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: CADTBT360_V1.025_GUI_Startup_Evidence
          path: |
            dist/gui-smoke/evidence/
            dist/gui-smoke/BUILD_INFO.txt
            dist/gui-smoke/SHA256SUMS.txt
            dist/gui-smoke/release-identity.txt
            dist/gui-smoke/installed-evidence/
            dist/gui-smoke/portable-sha256.txt
            dist/gui-smoke/setup-sha256.txt
          if-no-files-found: warn
          retention-days: 30
) { throw "Unexpected V1.025 prerelease tag: $tag" }
          New-Item -ItemType Directory -Force dist/gui-smoke | Out-Null
          $json = gh release view $tag --repo tbtdemo/tbt360_cad_2d --json tagName,targetCommitish,isPrerelease
