name: CAD 360 Stage285 Reopened DWG Native Editing
on:
  push:
    branches:
      - feature/CADTBT360_V1.025_xref-regression
    paths:
      - CADTBT360_V1.000/crates/io/src/tests.rs
      - .github/workflows/cad360-stage285-reopen-edit-save.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dwg-reopen-edit-save:
    runs-on: windows-latest
    timeout-minutes: 110
    defaults:
      run:
        working-directory: CADTBT360_V1.000
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.95.0'
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: CADTBT360_V1.000
      - name: Verify tested commit and Rust compiler
        shell: pwsh
        run: |
          git rev-parse HEAD
          cargo --version
          rustc --version
      - name: Compile native CAD DWG I/O
        run: cargo check --locked -p cadcraft-io
      - name: Reopen, edit native LINE and ARC, then resave twice
        run: cargo test --locked -p cadcraft-io stage285 -- --nocapture
      - name: Regress multi-layer source and BIM XData fidelity
        run: cargo test --locked -p cadcraft-io stage284 -- --nocapture
      - name: Regress two-cycle geometry preservation
        run: cargo test --locked -p cadcraft-io stage283 -- --nocapture
      - name: Confirm older DWG extension-data regression
        run: cargo test --locked -p cadcraft-io dwg_roundtrip_keeps_extension_data -- --nocapture
