name: CAD360 IFC Windows Portable

on:
  push:
    branches:
      - feature/bim-issue-audit
    paths:
      - 'SOURCE_CAD_R65/apps/cadcraft/**'
      - 'installer/**'
      - '.github/workflows/cad360-ifc-portable.yml'
  workflow_dispatch:
  pull_request:
    paths:
      - 'SOURCE_CAD_R65/apps/cadcraft/src/model3d.rs'
      - 'SOURCE_CAD_R65/apps/cadcraft/src/ifc_mesh.rs'
      - 'SOURCE_CAD_R65/apps/cadcraft/src/bounded_io.rs'
      - 'SOURCE_CAD_R65/apps/cadcraft/src/ifc_catalog.rs'
      - 'SOURCE_CAD_R65/apps/cadcraft/src/ifc_gpu.rs'
      - 'SOURCE_CAD_R65/apps/cadcraft/src/main.rs'
      - 'SOURCE_CAD_R65/apps/cadcraft/src/bim_collab.rs'
      - 'SOURCE_CAD_R65/apps/cadcraft/tools/export_ifc_obj_mapping.py'
      - 'SOURCE_CAD_R65/apps/cadcraft/tools/test_export_ifc_obj_mapping.py'
      - 'SOURCE_CAD_R65/apps/cadcraft/Cargo.toml'
      - 'installer/**'
      - '.github/workflows/cad360-ifc-portable.yml'

permissions:
  contents: read

jobs:
  source-snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Package active TBT source only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p delivery/CAD360_TBT
          git archive HEAD SOURCE_CAD_R65 | tar -x -C delivery/CAD360_TBT
          mv delivery/CAD360_TBT/SOURCE_CAD_R65 delivery/CAD360_TBT/TBT360_SOURCE
          git archive HEAD backend installer .github | tar -x -C delivery/CAD360_TBT
          git archive HEAD -- README.md .gitattributes | tar -x -C delivery/CAD360_TBT
          find delivery/CAD360_TBT/TBT360_SOURCE -name Cargo.toml -type f | wc -l
          printf '%s\n' 'CAD360 Viet Nam - TBT source handover' 'Build workspace: TBT360_SOURCE' 'Historical CAD and QTO reference workspaces are intentionally excluded.' 'Internal cadcraft crate names are preserved until a verified dependency migration.' > delivery/CAD360_TBT/README_HANDOVER.txt
          (cd delivery && zip -qr ../CAD360-TBT-Active-Source.zip CAD360_TBT)
          unzip -t CAD360-TBT-Active-Source.zip >/dev/null
          sha256sum CAD360-TBT-Active-Source.zip > CAD360-TBT-Active-Source.sha256
          git rev-parse HEAD > CAD360-TBT-Active-Source.commit.txt
          unzip -Z -1 CAD360-TBT-Active-Source.zip > CAD360-TBT-Active-Source.manifest.txt
          ! grep -Eq 'CAD_ORIGINAL_014_REFERENCE|QTO_R134_WEB_WORKSPACE|BUILD_CAD_R65_WINDOWS' CAD360-TBT-Active-Source.manifest.txt
          grep -q 'TBT360_SOURCE/Cargo.toml' CAD360-TBT-Active-Source.manifest.txt
          sha256sum --check CAD360-TBT-Active-Source.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: CAD360-TBT-Active-Source
          path: |
            CAD360-TBT-Active-Source.zip
            CAD360-TBT-Active-Source.sha256
            CAD360-TBT-Active-Source.commit.txt
            CAD360-TBT-Active-Source.manifest.txt
          if-no-files-found: error
          retention-days: 30

  ifc-metadata-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Test STEP to OBJ metadata mapping
        working-directory: SOURCE_CAD_R65
        run: python3 -m unittest discover -s apps/cadcraft/tools -p "test_export_ifc_obj_mapping.py" -v

  portable-windows:
    needs: ifc-metadata-tests
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: SOURCE_CAD_R65
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.95.0'
      - name: Validate Python IFC mapping export
        shell: pwsh
        run: |
          python -m py_compile apps/cadcraft/tools/export_ifc_obj_mapping.py
          python -m unittest discover -s apps/cadcraft/tools -p "test_export_ifc_obj_mapping.py" -v
      - name: Check IFC desktop code
        run: cargo check -p cadcraft --bin cadcraft --locked
      - name: Test IFC desktop module
        run: cargo test -p cadcraft --bin cadcraft --locked
      - name: Build Windows EXE and CLI
        run: cargo build -p cadcraft -p cadcraft-cli --release --locked
      - name: Package self-contained application folder
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $out = Join-Path $env:RUNNER_TEMP 'CAD360-IFC-Portable'
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          $exe = 'target/release/cadcraft.exe'
          if (!(Test-Path $exe)) { throw 'cargo build succeeded but cadcraft.exe is missing' }
          $exeBytes = [System.IO.File]::ReadAllBytes((Resolve-Path $exe))
          if ($exeBytes.Length -lt 4096 -or $exeBytes[0] -ne 0x4D -or $exeBytes[1] -ne 0x5A) { throw 'Output is not a valid Windows PE executable' }
          $peOffset = [BitConverter]::ToInt32($exeBytes, 0x3C)
          if ($peOffset -lt 64 -or $peOffset + 6 -ge $exeBytes.Length -or [Text.Encoding]::ASCII.GetString($exeBytes, $peOffset, 4) -ne "PE`0`0") { throw 'Invalid Windows PE header' }
          if ([BitConverter]::ToUInt16($exeBytes, $peOffset + 4) -ne 0x8664) { throw 'Expected x64 Windows executable' }
          Copy-Item $exe (Join-Path $out 'CAD360.exe')
          New-Item -ItemType Directory -Force -Path (Join-Path $out 'tools') | Out-Null
          Set-Content -Path (Join-Path $out 'tools/README.txt') -Value 'IfcConvert is NOT bundled unless a separately verified Windows x64 runtime package is integrated. This ZIP supports OBJ viewing; IFC to OBJ requires IfcConvert.exe and dependent DLLs.'
          Copy-Item 'apps/cadcraft/tools/export_ifc_obj_mapping.py' (Join-Path $out 'tools/export_ifc_obj_mapping.py')
          $sha = (Get-FileHash (Join-Path $out 'CAD360.exe') -Algorithm SHA256).Hash
          Set-Content -Path (Join-Path $out 'SHA256SUMS.txt') -Value "$sha  CAD360.exe"
          Write-Host "CAD360.exe SHA256: $sha"
          Write-Host 'Portable package excludes unverified IfcConvert.exe and dependent DLLs'
          Compress-Archive -Path (Join-Path $out '*') -DestinationPath (Join-Path $env:GITHUB_WORKSPACE 'CAD360-IFC-Portable.zip') -Force
      - name: Install Inno Setup compiler
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6/ISCC.exe'
          if (!(Test-Path $iscc)) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'Cannot install Inno Setup 6' }
          }
          if (!(Test-Path $iscc)) { throw 'ISCC.exe missing' }
      - name: Build CAD360 TBT Windows Setup
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6/ISCC.exe'
          & $iscc '/Qp' '../installer/CAD360_TBT_Windows.iss'
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup compilation failed' }
          $setupPath = '../dist/CAD360_VietNam_TBT_Setup.exe'
          if (!(Test-Path $setupPath)) { throw 'Windows Setup missing' }
          if ((Get-Item $setupPath).Length -lt 100000) { throw 'Windows Setup unexpectedly small' }
          (Get-FileHash $setupPath -Algorithm SHA256).Hash | Set-Content '../dist/CAD360_Setup_SHA256.txt'
      - uses: actions/upload-artifact@v4
        with:
          name: CAD360-TBT-Windows-Setup-x64
          path: |
            dist/CAD360_VietNam_TBT_Setup.exe
            dist/CAD360_Setup_SHA256.txt
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: CAD360-IFC-Portable-Windows-x64
          path: CAD360-IFC-Portable.zip
          if-no-files-found: error
          retention-days: 14
