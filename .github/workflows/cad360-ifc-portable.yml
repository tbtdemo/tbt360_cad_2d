name: CAD360 IFC Windows Portable

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'SOURCE_CAD_R65/apps/cadcraft/src/model3d.rs'
      - 'SOURCE_CAD_R65/apps/cadcraft/src/ifc_mesh.rs'
      - 'SOURCE_CAD_R65/apps/cadcraft/src/ifc_catalog.rs'
      - 'SOURCE_CAD_R65/apps/cadcraft/Cargo.toml'
      - '.github/workflows/cad360-ifc-portable.yml'

permissions:
  contents: read

jobs:
  portable-windows:
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: SOURCE_CAD_R65
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.95.0'
      - name: Check IFC desktop code
        run: cargo check -p cadcraft --bin cadcraft --locked
      - name: Test IFC desktop module
        run: cargo test -p cadcraft --bin cadcraft --locked
      - name: Build Windows EXE
        run: cargo build -p cadcraft --bin cadcraft --release --locked
      - name: Package self-contained application folder
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $out = Join-Path $env:RUNNER_TEMP 'CAD360-IFC-Portable'
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          Copy-Item 'target/release/cadcraft.exe' (Join-Path $out 'CAD360.exe')
          New-Item -ItemType Directory -Force -Path (Join-Path $out 'tools') | Out-Null
          $converter = 'apps/cadcraft/tools/IfcConvert.exe'
          if (Test-Path $converter) {
            Copy-Item $converter (Join-Path $out 'tools/IfcConvert.exe')
            Write-Host 'IfcConvert included; dependent DLLs require separate validation'
          } else {
            Set-Content -Path (Join-Path $out 'tools/README.txt') -Value 'IFC->OBJ conversion requires a separately built and validated IfcConvert.exe plus DLLs. OBJ viewing does not require it.'
          }
          Compress-Archive -Path (Join-Path $out '*') -DestinationPath (Join-Path $env:GITHUB_WORKSPACE 'CAD360-IFC-Portable.zip') -Force
      - uses: actions/upload-artifact@v4
        with:
          name: CAD360-IFC-Portable-Windows-x64
          path: CAD360-IFC-Portable.zip
          if-no-files-found: error
          retention-days: 14
