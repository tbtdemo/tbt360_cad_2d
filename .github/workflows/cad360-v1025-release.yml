name: CAD 360 V1.025 - Windows Setup Portable

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'installer/CADTBT360_V1.025_Windows.iss'
      - '.github/workflows/cad360-v1025-release.yml'
      - 'CADTBT360_V1.000/**'
  push:
    branches:
      - feature/CADTBT360_V1.025_xref-regression
    paths:
      - 'CADTBT360_V1.000/**'
      - 'installer/CADTBT360_V1.025_Windows.iss'
      - '.github/workflows/cad360-v1025-release.yml'
      - '.github/workflows/cad360-v1025-desktop-reliability.yml'

permissions:
  contents: read

concurrency:
  group: cad360-v1025-release-${{ github.ref }}
  # Finish each package attempt so Setup/Portable artifacts and failure logs can be audited.
  # Rapid source commits must not repeatedly cancel the expensive Windows release compile.
  cancel-in-progress: false

jobs:
  windows-package:
    name: Build, install, verify and package V1.025 x64
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Prepare Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: CADTBT360_V1.000
          key: cad360-v1025-release

      - name: Preflight Windows GUI and CLI compilation before expensive tests
        shell: pwsh
        working-directory: CADTBT360_V1.000
        run: |
          cargo check --locked -p cadcraft --bin cadcraft -p cadcraft-cli -p cadcraft-mcp
          if ($LASTEXITCODE -ne 0) { throw 'V1.025 Windows compile preflight failed; do not run slow release tests' }

      - name: Require image-to-CAD and native raster regression before release packaging
        shell: pwsh
        working-directory: CADTBT360_V1.000
        run: |
          $imageTests = @(cargo test --locked -p cadcraft-engine --lib image -- --list 2>&1)
          if ($LASTEXITCODE -ne 0) { $imageTests | Out-Host; throw 'V1.025 image test discovery failed' }
          $namedTests = @($imageTests | Where-Object { $_ -match '^.*image.*: test
          cargo test --locked -p cadcraft-mcp --lib agent_traces_an_image_into_editable_cad_via_mcp -- --nocapture
          if ($LASTEXITCODE -ne 0) { throw 'V1.025 AI image MCP trace failed' }
          cargo test --locked -p cadcraft-mcp --lib agent_projects_tilted_photo_into_editable_cad_without_warping_image -- --nocapture
          if ($LASTEXITCODE -ne 0) { throw 'V1.025 AI perspective tracing failed' }
          cargo test --locked -p cadcraft-mcp --lib ai_perspective_trace_remains_editable_after_dxf_save_reopen -- --nocapture
          if ($LASTEXITCODE -ne 0) { throw 'V1.025 AI DXF persistence failed' }
          cargo test --locked -p cadcraft-ui-egui --lib canvas::raster_image::tests -- --nocapture
          if ($LASTEXITCODE -ne 0) { throw 'V1.025 native PNG/JPG raster overlay failed' }
          cargo test --locked -p cadcraft-render --lib raster_image_reference_draws_only_outer_frame_without_obscuring_draft -- --nocapture
          if ($LASTEXITCODE -ne 0) { throw 'V1.025 IMAGE renderer frame failed' }
          cargo test --locked -p cadcraft-render --lib raster_imageclip_frame_matches_rectangle_and_concave_pixel_boundary -- --nocapture
          if ($LASTEXITCODE -ne 0) { throw 'V1.025 IMAGECLIP frame mismatch failed' }
          cargo test --locked -p cadcraft-render --lib raster_image_display_off_omits_entire_frame -- --nocapture
          if ($LASTEXITCODE -ne 0) { throw 'V1.025 IMAGE visibility regression failed' }

      - name: Verify Xref and DWG regression on release source
        shell: pwsh
        working-directory: CADTBT360_V1.000
        run: |
          cargo test --locked -p cadcraft-io --test it xref_roundtrip -- --nocapture
          if ($LASTEXITCODE -ne 0) { throw 'Xref regression failure' }
          cargo test --locked -p cadcraft-io --test it large_dwg_v1025 -- --nocapture
          if ($LASTEXITCODE -ne 0) { throw 'Large DWG regression failure' }

      - name: Build native Windows GUI and CLI (not copied from old release)
        shell: pwsh
        working-directory: CADTBT360_V1.000
        run: |
          cargo build --release --locked -p cadcraft -p cadcraft-cli
          if ($LASTEXITCODE -ne 0) { throw 'Windows release build failed' }
          foreach ($exe in @('target/release/cadcraft.exe', 'target/release/cadcraft-cli.exe')) {
            if (!(Test-Path $exe)) { throw "Missing freshly built binary: $exe" }
          }

      - name: Install Inno Setup and create version metadata
        shell: pwsh
        run: |
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (!(Test-Path $iscc)) { choco install innosetup -y --no-progress }
          if (!(Test-Path $iscc)) { throw 'Inno Setup compiler not installed' }
          New-Item -ItemType Directory -Force dist/v1025 | Out-Null
          @('Release=CADTBT360_V1.025', "SourceCommit=$env:GITHUB_SHA", 'Architecture=windows-x64', 'NativeBuild=true', 'GUIAcceptance=NOT_VERIFIED') | Set-Content dist/v1025/BUILD_INFO.txt -Encoding utf8

      - name: Package new Setup and Portable
        shell: pwsh
        run: |
          & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' /Qp installer/CADTBT360_V1.025_Windows.iss
          if ($LASTEXITCODE -ne 0) { throw 'V1.025 Inno Setup failed' }
          $setup = 'dist/v1025/CADTBT360_V1.025_Setup_Windows_x64.exe'
          if (!(Test-Path $setup)) { throw 'V1.025 Setup output missing' }
          New-Item -ItemType Directory -Force dist/v1025/portable | Out-Null
          Copy-Item CADTBT360_V1.000/target/release/cadcraft.exe dist/v1025/portable/CADTBT360.exe
          Copy-Item CADTBT360_V1.000/target/release/cadcraft-cli.exe dist/v1025/portable/CADTBT360_CLI.exe
          Copy-Item dist/v1025/BUILD_INFO.txt dist/v1025/portable/BUILD_INFO.txt
          Compress-Archive -Path dist/v1025/portable/* -DestinationPath dist/v1025/CADTBT360_V1.025_Portable_Windows_x64.zip -Force

      - name: Smoke test installed application, uninstall and binary identity
        shell: pwsh
        run: |
          $setup = (Resolve-Path 'dist/v1025/CADTBT360_V1.025_Setup_Windows_x64.exe').Path
          $dest = Join-Path $env:RUNNER_TEMP 'CADTBT360_V1025_InstallTest'
          $proc = Start-Process -FilePath $setup -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/DIR=$dest") -Wait -PassThru
          if ($proc.ExitCode -ne 0) { throw "Installer failed with code $($proc.ExitCode)" }
          foreach ($n in @('CADTBT360.exe', 'CADTBT360_CLI.exe', 'BUILD_INFO.txt')) {
            if (!(Test-Path (Join-Path $dest $n))) { throw "Installed file missing: $n" }
          }
          $srcGui = (Get-FileHash 'CADTBT360_V1.000/target/release/cadcraft.exe' -Algorithm SHA256).Hash
          $srcCli = (Get-FileHash 'CADTBT360_V1.000/target/release/cadcraft-cli.exe' -Algorithm SHA256).Hash
          $instGui = (Get-FileHash (Join-Path $dest 'CADTBT360.exe') -Algorithm SHA256).Hash
          $instCli = (Get-FileHash (Join-Path $dest 'CADTBT360_CLI.exe') -Algorithm SHA256).Hash
          if ($srcGui -ne $instGui -or $srcCli -ne $instCli) { throw 'Installed binaries do not match current source build' }
          if (-not (Select-String -Path (Join-Path $dest 'BUILD_INFO.txt') -Pattern 'Release=CADTBT360_V1.025' -Quiet)) { throw 'Incorrect release metadata' }
          $uninstaller = Join-Path $dest 'unins000.exe'
          if (!(Test-Path $uninstaller)) { throw 'Missing Inno Setup uninstaller' }
          $uninstall = Start-Process -FilePath $uninstaller -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART') -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) { throw "Uninstaller failed with code $($uninstall.ExitCode)" }
          if (Test-Path (Join-Path $dest 'CADTBT360.exe')) { throw 'Uninstaller left main executable behind' }

      - name: Verify portable archive, create SHA256 checksums
        shell: pwsh
        run: |
          $zip = 'dist/v1025/CADTBT360_V1.025_Portable_Windows_x64.zip'
          $tmp = Join-Path $env:RUNNER_TEMP 'CADTBT360_V1025_PortableTest'
          Expand-Archive $zip -DestinationPath $tmp -Force
          foreach ($n in @('CADTBT360.exe', 'CADTBT360_CLI.exe', 'BUILD_INFO.txt')) {
            if (!(Test-Path (Join-Path $tmp $n))) { throw "Portable archive missing $n" }
          }
          $hashes = @()
          foreach ($name in @('CADTBT360_V1.025_Setup_Windows_x64.exe', 'CADTBT360_V1.025_Portable_Windows_x64.zip')) {
            $h = Get-FileHash (Join-Path 'dist/v1025' $name) -Algorithm SHA256
            $hashes += "$($h.Hash)  $name"
          }
          $hashes | Set-Content dist/v1025/SHA256SUMS.txt -Encoding ascii

      - name: Upload V1.025 Windows Setup and Portable
        uses: actions/upload-artifact@v4
        with:
          name: CADTBT360_V1.025_Windows_x64_Setup_Portable
          path: |
            dist/v1025/CADTBT360_V1.025_Setup_Windows_x64.exe
            dist/v1025/CADTBT360_V1.025_Portable_Windows_x64.zip
            dist/v1025/BUILD_INFO.txt
            dist/v1025/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
 })
          if ($namedTests.Count -lt 4) { $imageTests | Out-Host; throw "V1.025 image test discovery unexpectedly found only $($namedTests.Count) tests" }
          cargo test --locked -p cadcraft-engine --lib image -- --nocapture
          if ($LASTEXITCODE -ne 0) { throw 'V1.025 IMAGE engine regression failed' }
          cargo test --locked -p cadcraft-mcp --lib agent_traces_an_image_into_editable_cad_via_mcp -- --nocapture
          if ($LASTEXITCODE -ne 0) { throw 'V1.025 AI image MCP trace failed' }
