name: CAD 360 V1.025 - Windows Setup Portable

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'installer/CADTBT360_V1.025_Windows.iss'
      - '.github/workflows/cad360-v1025-release.yml'
      - 'CADTBT360_V1.000/**'
      - 'scripts/verify_mcp_executable.ps1'
      - 'scripts/validate_mcp_smoke_fixture.py'
      - 'scripts/verify_source_bundle.py'
      - 'scripts/validate_full_user_guide.py'
      - 'scripts/validate_word_guide.py'
      - 'docs/user-guide/**'
  push:
    branches:
      - feature/CADTBT360_V1.025_xref-regression
    paths:
      - 'CADTBT360_V1.000/**'
      - 'installer/CADTBT360_V1.025_Windows.iss'
      - '.github/workflows/cad360-v1025-release.yml'
      - '.github/workflows/cad360-v1025-desktop-reliability.yml'
      - 'scripts/verify_mcp_executable.ps1'
      - 'scripts/validate_mcp_smoke_fixture.py'
      - 'scripts/verify_source_bundle.py'
      - 'scripts/validate_full_user_guide.py'
      - 'scripts/validate_word_guide.py'
      - 'docs/user-guide/**'

permissions:
  contents: write  # only for publishing verified prerelease binaries; checkout persists no credentials

concurrency:
  # Windows release builds take long enough that cancelling the running compile
  # on every push can starve Setup/Portable production indefinitely. GitHub
  # automatically replaces an older PENDING run with the newest queued push,
  # while the single RUNNING build is allowed to complete.
  # Keep manual dispatches separate from automatic push builds.
  group: cad360-v1025-release-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  windows-package:
    name: Build, install, verify and package V1.025 x64
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - name: Require V1.025 feature branch for manual Windows release
        if: ${{ github.event_name == 'workflow_dispatch' }}
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -ne 'refs/heads/feature/CADTBT360_V1.025_xref-regression') {
            throw "CAD 360 V1.025 release must use feature/CADTBT360_V1.025_xref-regression, not $env:GITHUB_REF. In Run workflow, select the feature branch before starting."
          }

      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Prepare Python for offline reproducible Word user manual and fixture checks
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate embedded image fixture before Rust compilation
        id: validate_fixture
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python scripts/validate_mcp_smoke_fixture.py scripts/verify_mcp_executable.ps1
          if ($LASTEXITCODE -ne 0) { throw 'PNG fixture invalid; stop before expensive Rust compilation' }
          python scripts/validate_full_user_guide.py docs/user-guide/CADTBT360_V1.025_GIAO_TRINH_TONG_HOP_TAT_CA_TINH_NANG.md
          if ($LASTEXITCODE -ne 0) { throw 'Full CAD 360 user guide incomplete; do not ship an AI-only manual' }

      - name: Build and validate both Word manuals before Rust compile
        id: manuals
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force 'dist/v1025' | Out-Null
          python docs/user-guide/build_word_guide.py docs/user-guide/CADTBT360_V1.025_HUONG_DAN_AI_TU_ANH_THANH_CAD.md dist/v1025/CADTBT360_V1.025_HUONG_DAN_AI_TU_ANH_THANH_CAD.docx
          if ($LASTEXITCODE -ne 0 -or !(Test-Path 'dist/v1025/CADTBT360_V1.025_HUONG_DAN_AI_TU_ANH_THANH_CAD.docx')) { throw 'Cannot build AI Word supplement before Rust compile' }
          python docs/user-guide/build_word_guide.py docs/user-guide/CADTBT360_V1.025_GIAO_TRINH_TONG_HOP_TAT_CA_TINH_NANG.md dist/v1025/CADTBT360_V1.025_GIAO_TRINH_TONG_HOP.docx
          if ($LASTEXITCODE -ne 0 -or !(Test-Path 'dist/v1025/CADTBT360_V1.025_GIAO_TRINH_TONG_HOP.docx')) { throw 'Cannot build complete CAD 360 Word guide before Rust compile' }
          python scripts/validate_word_guide.py dist/v1025/CADTBT360_V1.025_GIAO_TRINH_TONG_HOP.docx
          if ($LASTEXITCODE -ne 0) { throw 'Full-product manual missing native tables, heading hierarchy or 21 lessons' }

      - name: Prepare Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: CADTBT360_V1.000
          key: cad360-v1025-release

      - name: Preflight Windows GUI and CLI compilation before expensive tests
        id: preflight
        shell: pwsh
        working-directory: CADTBT360_V1.000
        run: |
          $ErrorActionPreference = 'Continue'
          New-Item -ItemType Directory -Force '../dist/v1025/diagnostics' | Out-Null
          # Tee stderr as text and preserve the actual Cargo exit code. These logs are
          # uploaded with CI_FAILURE.txt if the expensive Rust build fails or is cancelled.
          cargo check --locked -p cadcraft --bin cadcraft 2>&1 | Out-String -Stream | Tee-Object -FilePath '../dist/v1025/diagnostics/CARGO_CHECK_GUI.log' | Out-Host
          if ($LASTEXITCODE -ne 0) { throw 'V1.025 GUI binary compile failed; inspect CARGO_CHECK_GUI.log' }
          cargo check --locked -p cadcraft-cli 2>&1 | Out-String -Stream | Tee-Object -FilePath '../dist/v1025/diagnostics/CARGO_CHECK_CLI.log' | Out-Host
          if ($LASTEXITCODE -ne 0) { throw 'V1.025 CLI compile failed; inspect CARGO_CHECK_CLI.log' }
          cargo check --locked -p cadcraft-mcp 2>&1 | Out-String -Stream | Tee-Object -FilePath '../dist/v1025/diagnostics/CARGO_CHECK_MCP.log' | Out-Host
          if ($LASTEXITCODE -ne 0) { throw 'V1.025 MCP compile failed; inspect CARGO_CHECK_MCP.log' }

      - name: Verify required named regression tests exist before running them
        id: discover
        shell: pwsh
        working-directory: CADTBT360_V1.000
        run: |
          $ErrorActionPreference = 'Stop'
          $required = @(
            @{ Package='cadcraft-cli'; Target='bin'; Test='image_trace_entity_json_matches_windows_installer_smoke_contract' },
            @{ Package='cadcraft-mcp'; Target='lib'; Test='agent_traces_an_image_into_editable_cad_via_mcp' },
            @{ Package='cadcraft-mcp'; Target='lib'; Test='agent_projects_tilted_photo_into_editable_cad_without_warping_image' },
            @{ Package='cadcraft-mcp'; Target='lib'; Test='ai_perspective_trace_remains_editable_after_dxf_save_reopen' },
            @{ Package='cadcraft-ui-egui'; Target='lib'; Test='canvas::raster_image::tests' },
            @{ Package='cadcraft-render'; Target='lib'; Test='raster_image_reference_draws_only_outer_frame_without_obscuring_draft' },
            @{ Package='cadcraft-render'; Target='lib'; Test='raster_imageclip_frame_matches_rectangle_and_concave_pixel_boundary' },
            @{ Package='cadcraft-render'; Target='lib'; Test='raster_image_display_off_omits_entire_frame' },
            @{ Package='cadcraft-io'; Target='it'; Test='xref_roundtrip' },
            @{ Package='cadcraft-io'; Target='it'; Test='large_dwg_v1025' },
            @{ Package='cadcraft-mcp'; Target='lib'; Test='ai_automatic_raster_to_cad_lines_from_real_png' },
            @{ Package='cadcraft-mcp'; Target='lib'; Test='raster_vector_preview_real_png_has_exact_scaled_world_coordinates' },
            @{ Package='cadcraft-mcp'; Target='lib'; Test='raster_rectangular_png_preview_and_headless_commit_create_one_closed_polyline' },
            @{ Package='cadcraft-mcp'; Target='lib'; Test='ai_mcp_rectangle_png_creates_closed_polyline_and_single_undo' },
            @{ Package='cadcraft-mcp'; Target='lib'; Test='raster_rectangular_png_with_open_side_does_not_invent_wall' },
            @{ Package='cadcraft-mcp'; Target='lib'; Test='ai_parallel_wall_candidate_hints_find_two_near_equal_parallel_lines' },
            @{ Package='cadcraft-mcp'; Target='lib'; Test='ai_wall_centerline_is_only_created_for_unique_parallel_pair' },
            @{ Package='cadcraft-mcp'; Target='lib'; Test='ai_wall_centerline_real_png_keeps_both_edges_and_adds_editable_centerline' },
            @{ Package='cadcraft-mcp'; Target='lib'; Test='ai_wall_centerline_rejects_creation_without_hint_review' },
            @{ Package='cadcraft-mcp'; Target='lib'; Test='ai_parallel_wall_hints_refuse_disjoint_or_crossed_lines' },
            @{ Package='cadcraft-mcp'; Target='lib'; Test='ai_auto_raster_to_cad_dxf_roundtrip_preserves_editable_lines' },
            @{ Package='cadcraft-mcp'; Target='lib'; Test='ai_auto_raster_mcp_failed_second_line_rolls_back_first_line' },
            @{ Package='cadcraft-mcp'; Target='lib'; Test='ai_auto_raster_mcp_document_switch_must_not_undo_unrelated_new_drawing' },
            @{ Package='cadcraft-mcp'; Target='lib'; Test='ai_auto_raster_mcp_rejects_existing_undo_group_without_changes' },
            @{ Package='cadcraft-mcp'; Target='lib'; Test='ai_image_mcp_inspect_exposes_revision_and_undo_safety_state' },
            @{ Package='cadcraft-mcp'; Target='lib'; Test='ai_auto_raster_diagonal_png_creates_editable_line' },
            @{ Package='cadcraft-mcp'; Target='lib'; Test='ai_arbitrary_angle_raster_to_cad_png_creates_editable_line' },
            @{ Package='cadcraft'; Target='gui'; Test='ai_raster_panel_defaults_to_preview' },
            @{ Package='cadcraft'; Target='gui'; Test='ai_raster_help_is_accessible_offline_without_external_links' },
            @{ Package='cadcraft'; Target='gui'; Test='complete_user_manual_is_found_in_setup_and_portable_paths' },
            @{ Package='cadcraft'; Target='gui'; Test='ai_raster_undo_rolls_back_partial_batch' },
            @{ Package='cadcraft'; Target='gui'; Test='ai_raster_preview_never_commits_to_another_open_drawing' },
            @{ Package='cadcraft'; Target='gui'; Test='ai_raster_preview_refuses_switch_away_and_back_with_unchanged_revision' },
            @{ Package='cadcraft'; Target='gui'; Test='ai_raster_calibration_uses_known_length_and_pixel_distance' },
            @{ Package='cadcraft'; Target='gui'; Test='ai_raster_closed_rectangle_mode_is_opt_in_and_preserves_preview_safety' },
            @{ Package='cadcraft'; Target='gui'; Test='ai_raster_wall_pair_hints_are_opt_in_and_non_mutating' },
            @{ Package='cadcraft'; Target='gui'; Test='ai_raster_wall_centerline_creation_requires_explicit_user_opt_in' },
            @{ Package='cadcraft'; Target='gui'; Test='ai_raster_calibration_rejects_zero_nan_and_oversize_ratio' }
          )
          foreach ($case in $required) {
            if ($case.Target -eq 'lib') { $listing = @(cargo test --locked -p $case.Package --lib $case.Test -- --list 2>&1) }
            elseif ($case.Target -eq 'bin') { $listing = @(cargo test --locked -p $case.Package --bin cadcraft-cli $case.Test -- --list 2>&1) }
            elseif ($case.Target -eq 'gui') { $listing = @(cargo test --locked -p $case.Package --bin cadcraft $case.Test -- --list 2>&1) }
            else { $listing = @(cargo test --locked -p $case.Package --test it $case.Test -- --list 2>&1) }
            if ($LASTEXITCODE -ne 0) { $listing | Out-Host; throw "Cannot discover tests for $($case.Package): $($case.Test)" }
            $matched = @($listing | Where-Object { $_ -like '*: test' })
            if ($matched.Count -eq 0) { $listing | Out-Host; throw "No tests found for $($case.Package): $($case.Test)" }
            Write-Host "Verified $($matched.Count) regression tests in $($case.Package): $($case.Test)"
          }

      - name: Validate installed CLI image-trace JSON contract at source
        id: cli_contract
        shell: pwsh
        working-directory: CADTBT360_V1.000
        run: |
          cargo test --locked -p cadcraft-cli --bin cadcraft-cli image_trace_entity_json_matches_windows_installer_smoke_contract -- --nocapture
          if ($LASTEXITCODE -ne 0) { throw 'V1.025 CLI entity JSON contract regression failed; abort Windows packaging' }

      - name: Require image-to-CAD and native raster regression before release packaging
        id: ai_tests
        shell: pwsh
        working-directory: CADTBT360_V1.000
        run: |
          $imageTests = @(cargo test --locked -p cadcraft-engine --lib image -- --list 2>&1)
          if ($LASTEXITCODE -ne 0) { $imageTests | Out-Host; throw 'V1.025 image test discovery failed' }
          $namedTests = @($imageTests | Where-Object { $_ -match ': test$' })
          if ($namedTests.Count -lt 4) { $imageTests | Out-Host; throw "V1.025 image test discovery unexpectedly found only $($namedTests.Count) tests" }
          cargo test --locked -p cadcraft-engine --lib image -- --nocapture
          if ($LASTEXITCODE -ne 0) { throw 'V1.025 IMAGE engine regression failed' }
          cargo test --locked -p cadcraft-mcp --lib agent_traces_an_image_into_editable_cad_via_mcp -- --nocapture
          if ($LASTEXITCODE -ne 0) { throw 'V1.025 AI image MCP trace failed' }
          cargo test --locked -p cadcraft-mcp --lib agent_projects_tilted_photo_into_editable_cad_without_warping_image -- --nocapture
          if ($LASTEXITCODE -ne 0) { throw 'V1.025 AI perspective tracing failed' }
          cargo test --locked -p cadcraft-mcp --lib ai_perspective_trace_remains_editable_after_dxf_save_reopen -- --nocapture
          if ($LASTEXITCODE -ne 0) { throw 'V1.025 AI DXF persistence failed' }
          cargo test --locked -p cadcraft-mcp --lib ai_mcp_rectangle_png_creates_closed_polyline_and_single_undo -- --nocapture
          if ($LASTEXITCODE -ne 0) { throw 'V1.025 MCP Agent failed to create/Undo editable closed rectangle polyline' }
          cargo test --locked -p cadcraft-mcp --lib ai_wall_centerline_ -- --nocapture
          if ($LASTEXITCODE -ne 0) { throw 'AI wall centerline real-PNG, opt-in or Undo regression failed' }
          cargo test --locked -p cadcraft-mcp --lib ai_parallel_wall_ -- --nocapture
          if ($LASTEXITCODE -ne 0) { throw 'AI parallel edge preview safety regression failed' }
          cargo test --locked -p cadcraft-mcp --lib raster_rectangular_png -- --nocapture
          if ($LASTEXITCODE -ne 0) { throw 'AI rectangle PLINE or open-wall safety regression failed' }
          cargo test --locked -p cadcraft-mcp --lib raster_vector_preview_real_png_has_exact_scaled_world_coordinates -- --nocapture
          if ($LASTEXITCODE -ne 0) { throw 'V1.025 real PNG raster centerline coordinates or unit conversion regressed' }
          cargo test --locked -p cadcraft-mcp --lib ai_trace_quality_gate -- --nocapture
          if ($LASTEXITCODE -ne 0) { throw 'V1.025 AI vector trace geometry quality gate failed' }
          cargo test --locked -p cadcraft-mcp --lib ai_trace_quality_large_survey_coordinates -- --nocapture
          if ($LASTEXITCODE -ne 0) { throw 'V1.025 AI large-coordinate geometry regression failed' }
          cargo test --locked -p cadcraft-mcp --lib ai_trace_quality_large_2048_point_image_trace -- --nocapture
          if ($LASTEXITCODE -ne 0) { throw 'V1.025 AI 2048-point broad-phase regression failed' }
          cargo test --locked -p cadcraft-mcp --lib ai_trace_quality_broad_phase_preserves_nonadjacent_crossings -- --nocapture
          if ($LASTEXITCODE -ne 0) { throw 'V1.025 AI broad-phase missed a real crossing' }
          cargo test --locked -p cadcraft-mcp --lib ai_validated_image_trace -- --nocapture
          if ($LASTEXITCODE -ne 0) { throw 'V1.025 validated IMAGE AI trace MCP test failed' }
          cargo test --locked -p cadcraft-mcp --lib ai_validated_perspective_trace -- --nocapture
          if ($LASTEXITCODE -ne 0) { throw 'V1.025 validated perspective AI trace MCP test failed' }
          cargo test --locked -p cadcraft-mcp --lib ai_world_projection_gate -- --nocapture
          if ($LASTEXITCODE -ne 0) { throw 'V1.025 AI world-coordinate projection validation failed' }
          cargo test --locked -p cadcraft-mcp --lib ai_automatic_raster_to_cad_lines_from_real_png -- --nocapture
          if ($LASTEXITCODE -ne 0) { throw 'V1.025 automatic raster-to-editable-CAD image recognition failed' }
          cargo test --locked -p cadcraft-mcp --lib ai_auto_raster_to_cad_dxf_roundtrip_preserves_editable_lines -- --nocapture
          if ($LASTEXITCODE -ne 0) { throw 'V1.025 AI PNG-to-CAD DXF persistence regression failed' }
          cargo test --locked -p cadcraft-mcp --lib ai_auto_raster_mcp_failed_second_line_rolls_back_first_line -- --nocapture
          if ($LASTEXITCODE -ne 0) { throw 'V1.025 MCP automatic image import failed to rollback partial edits' }
          cargo test --locked -p cadcraft-mcp --lib ai_auto_raster_mcp_document_switch_must_not_undo_unrelated_new_drawing -- --nocapture
          if ($LASTEXITCODE -ne 0) { throw 'V1.025 MCP image import attempted to undo unrelated drawing after switch' }
          cargo test --locked -p cadcraft-mcp --lib ai_auto_raster_mcp_rejects_existing_undo_group_without_changes -- --nocapture
          if ($LASTEXITCODE -ne 0) { throw 'V1.025 MCP image import unexpectedly closed caller Undo group' }
          cargo test --locked -p cadcraft-mcp --lib ai_image_mcp_inspect_exposes_revision_and_undo_safety_state -- --nocapture
          if ($LASTEXITCODE -ne 0) { throw 'V1.025 MCP inspect safety fields / revision tracking failed' }
          cargo test --locked -p cadcraft-mcp --lib ai_auto_raster_to_cad_refuses_missing_file -- --nocapture
          if ($LASTEXITCODE -ne 0) { throw 'V1.025 raster AI source validation failed' }
          cargo test --locked -p cadcraft-mcp --lib raster_vector_detects_ -- --nocapture
          if ($LASTEXITCODE -ne 0) { throw 'V1.025 raster horizontal/vertical/diagonal detection regressions failed' }
          cargo test --locked -p cadcraft-mcp --lib ai_auto_raster_diagonal_png_creates_editable_line -- --nocapture
          if ($LASTEXITCODE -ne 0) { throw 'V1.025 diagonal raster-to-editable-CAD MCP regression failed' }
          cargo test --locked -p cadcraft-mcp --lib raster_vector_detects_thirty_degree_line_with_pca -- --nocapture
          if ($LASTEXITCODE -ne 0) { throw 'V1.025 arbitrary-angle isolated raster line detection failed' }
          cargo test --locked -p cadcraft-mcp --lib raster_vector_does_not_misclassify_solid_rectangle -- --nocapture
          if ($LASTEXITCODE -ne 0) { throw 'V1.025 PCA raster false-positive rejection failed' }
          cargo test --locked -p cadcraft-mcp --lib ai_arbitrary_angle_raster_to_cad_png_creates_editable_line -- --nocapture
          if ($LASTEXITCODE -ne 0) { throw 'V1.025 arbitrary-angle PNG to editable CAD regression failed' }
          cargo test --locked -p cadcraft --bin cadcraft ai_raster_panel -- --nocapture
          if ($LASTEXITCODE -ne 0) { throw 'V1.025 native image-to-CAD GUI preview regression failed' }
          cargo test --locked -p cadcraft --bin cadcraft complete_user_manual_is_found_in_setup_and_portable_paths -- --nocapture
          if ($LASTEXITCODE -ne 0) { throw 'Complete product user guide Setup/Portable path discovery failed' }
          cargo test --locked -p cadcraft --bin cadcraft ai_raster_help_is_accessible_offline_without_external_links -- --nocapture
          if ($LASTEXITCODE -ne 0) { throw 'V1.025 offline Vietnamese AI user guide integration failed' }
          cargo test --locked -p cadcraft --bin cadcraft ai_raster_wall_centerline_creation_requires_explicit_user_opt_in -- --nocapture
          if ($LASTEXITCODE -ne 0) { throw 'AI wall centerline GUI opt-in safety regression failed' }
          cargo test --locked -p cadcraft --bin cadcraft ai_raster_wall_pair_hints_are_opt_in_and_non_mutating -- --nocapture
          if ($LASTEXITCODE -ne 0) { throw 'AI wall pair hint preview safety regression failed' }
          cargo test --locked -p cadcraft --bin cadcraft ai_raster_closed_rectangle_mode_is_opt_in_and_preserves_preview_safety -- --nocapture
          if ($LASTEXITCODE -ne 0) { throw 'V1.025 AI GUI rectangle opt-in or Preview gate failed' }
          cargo test --locked -p cadcraft --bin cadcraft ai_raster_calibration -- --nocapture
          if ($LASTEXITCODE -ne 0) { throw 'V1.025 AI raster measurement calibration validation regressed' }
          cargo test --locked -p cadcraft --bin cadcraft ai_raster_preview_refuses_switch_away_and_back_with_unchanged_revision -- --nocapture
          if ($LASTEXITCODE -ne 0) { throw 'V1.025 AI GUI preview allowed stale drawing after document switch-away-and-back' }
          cargo test --locked -p cadcraft-ui-egui --lib canvas::raster_image::tests -- --nocapture
          if ($LASTEXITCODE -ne 0) { throw 'V1.025 native PNG/JPG raster overlay failed' }
          cargo test --locked -p cadcraft-render --lib raster_image_reference_draws_only_outer_frame_without_obscuring_draft -- --nocapture
          if ($LASTEXITCODE -ne 0) { throw 'V1.025 IMAGE renderer frame failed' }
          cargo test --locked -p cadcraft-render --lib raster_imageclip_frame_matches_rectangle_and_concave_pixel_boundary -- --nocapture
          if ($LASTEXITCODE -ne 0) { throw 'V1.025 IMAGECLIP frame mismatch failed' }
          cargo test --locked -p cadcraft-render --lib raster_image_display_off_omits_entire_frame -- --nocapture
          if ($LASTEXITCODE -ne 0) { throw 'V1.025 IMAGE visibility regression failed' }

      - name: Verify Xref and DWG regression on release source
        id: cad_tests
        shell: pwsh
        working-directory: CADTBT360_V1.000
        run: |
          cargo test --locked -p cadcraft-io --test it xref_roundtrip -- --nocapture
          if ($LASTEXITCODE -ne 0) { throw 'Xref regression failure' }
          cargo test --locked -p cadcraft-io --test it large_dwg_v1025 -- --nocapture
          if ($LASTEXITCODE -ne 0) { throw 'Large DWG regression failure' }

      - name: Build native Windows GUI and CLI (not copied from old release)
        id: release_build
        shell: pwsh
        working-directory: CADTBT360_V1.000
        run: |
          $ErrorActionPreference = 'Continue'
          New-Item -ItemType Directory -Force '../dist/v1025/diagnostics' | Out-Null
          # Embed the exact GitHub commit in the desktop GUI build badge and
          # version output; otherwise the released GUI silently displays DEV.
          $env:CAD360_BUILD_SHA = $env:GITHUB_SHA
          $env:CADCRAFT_BUILD_SHA = $env:GITHUB_SHA
          if ($env:CAD360_BUILD_SHA -notmatch '^[0-9a-fA-F]{40}$') { throw 'Missing full GITHUB_SHA for GUI build identity' }
          $desktopSource = Get-Content 'apps/cadcraft/src/main.rs' -Raw
          if ($desktopSource -notmatch 'CADTBT360_V1[.]025' -or $desktopSource -match 'CAD TBT 360 — V1[.]000') { throw 'Desktop GUI source does not display the requested V1.025 release identity' }
          # Check and release builds differ: capture compiler/linker output from the
          # actual Windows x64 EXE build rather than only saving preflight logs.
          cargo build --release --locked -p cadcraft -p cadcraft-cli 2>&1 | Out-String -Stream | Tee-Object -FilePath '../dist/v1025/diagnostics/CARGO_RELEASE_BUILD.log' | Out-Host
          if ($LASTEXITCODE -ne 0) { throw 'Windows release build failed; inspect CARGO_RELEASE_BUILD.log in failure diagnostics' }
          foreach ($exe in @('target/release/cadcraft.exe', 'target/release/cadcraft-cli.exe')) {
            if (!(Test-Path $exe)) { throw "Missing freshly built binary: $exe" }
          }
          # Verify the bytes of the freshly compiled GUI, not only the Rust source.
          # The desktop displays a full embedded SHA in its build-info tooltip and
          # CADTBT360_V1.025 in the workspace header. A stale/cached EXE must fail.
          $nativeGui = 'target/release/cadcraft.exe'
          $nativeGuiText = [System.Text.Encoding]::ASCII.GetString([System.IO.File]::ReadAllBytes((Resolve-Path $nativeGui).Path))
          if (-not $nativeGuiText.Contains('CADTBT360_V1.025')) { throw 'Compiled Windows GUI EXE lacks the V1.025 version indicator' }
          if (-not $nativeGuiText.Contains($env:GITHUB_SHA)) { throw "Compiled Windows GUI EXE lacks exact embedded source commit $env:GITHUB_SHA" }
          Remove-Variable nativeGuiText
          Write-Host "Verified native Windows GUI embeds V1.025 and full source commit $env:GITHUB_SHA"

      - name: Install Inno Setup and create version metadata
        id: prepare_installer
        shell: pwsh
        run: |
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (!(Test-Path $iscc)) { choco install innosetup -y --no-progress }
          if (!(Test-Path $iscc)) { throw 'Inno Setup compiler not installed' }
          New-Item -ItemType Directory -Force dist/v1025 | Out-Null
          @('Release=CADTBT360_V1.025', "SourceCommit=$env:GITHUB_SHA", 'Architecture=windows-x64', 'NativeBuild=true', 'GUIAcceptance=NOT_VERIFIED') | Set-Content dist/v1025/BUILD_INFO.txt -Encoding utf8
          if (!(Test-Path 'dist/v1025/CADTBT360_V1.025_HUONG_DAN_AI_TU_ANH_THANH_CAD.docx') -or !(Test-Path 'dist/v1025/CADTBT360_V1.025_GIAO_TRINH_TONG_HOP.docx')) { throw 'Preflight-generated Word manuals missing at packaging time' }

      - name: Package new Setup and Portable
        id: package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          New-Item -ItemType Directory -Force dist/v1025/diagnostics | Out-Null
          & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' /Qp installer/CADTBT360_V1.025_Windows.iss 2>&1 | Out-String -Stream | Tee-Object -FilePath dist/v1025/diagnostics/INNO_SETUP_BUILD.log | Out-Host
          if ($LASTEXITCODE -ne 0) { throw 'V1.025 Inno Setup failed; inspect INNO_SETUP_BUILD.log in failure diagnostics' }
          $setup = 'dist/v1025/CADTBT360_V1.025_Setup_Windows_x64.exe'
          if (!(Test-Path $setup)) { throw 'V1.025 Setup output missing' }
          New-Item -ItemType Directory -Force dist/v1025/portable | Out-Null
          Copy-Item CADTBT360_V1.000/target/release/cadcraft.exe dist/v1025/portable/CADTBT360.exe
          Copy-Item CADTBT360_V1.000/target/release/cadcraft-cli.exe dist/v1025/portable/CADTBT360_CLI.exe
          Copy-Item dist/v1025/BUILD_INFO.txt dist/v1025/portable/BUILD_INFO.txt
          $guide = 'docs/user-guide/CADTBT360_V1.025_HUONG_DAN_AI_TU_ANH_THANH_CAD.md'
          if (!(Test-Path $guide)) { throw "Missing required Vietnamese user guide: $guide" }
          Copy-Item $guide dist/v1025/portable/HUONG_DAN_AI_TU_ANH_THANH_CAD.md
          Copy-Item $guide dist/v1025/HUONG_DAN_AI_TU_ANH_THANH_CAD.md
          Copy-Item dist/v1025/CADTBT360_V1.025_HUONG_DAN_AI_TU_ANH_THANH_CAD.docx dist/v1025/portable/HUONG_DAN_AI_TU_ANH_THANH_CAD.docx
          Copy-Item dist/v1025/CADTBT360_V1.025_GIAO_TRINH_TONG_HOP.docx dist/v1025/portable/GIAO_TRINH_TONG_HOP_CAD360.docx
          Compress-Archive -Path dist/v1025/portable/* -DestinationPath dist/v1025/CADTBT360_V1.025_Portable_Windows_x64.zip -Force

      - name: Smoke test installed application, uninstall and binary identity
        id: installed_smoke
        shell: pwsh
        run: |
          $setup = (Resolve-Path 'dist/v1025/CADTBT360_V1.025_Setup_Windows_x64.exe').Path
          # Test a genuine Windows install path with spaces. Start-Process joins its
          # ArgumentList into a command line, so Inno Setup's /DIR value must be quoted.
          $dest = Join-Path $env:RUNNER_TEMP 'CADTBT360 V1025 Install Test'
          $dirArgument = '/DIR="{0}"' -f $dest
          $proc = Start-Process -FilePath $setup -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', $dirArgument) -Wait -PassThru
          if ($proc.ExitCode -ne 0) { throw "Installer failed with code $($proc.ExitCode)" }
          foreach ($n in @('CADTBT360.exe', 'CADTBT360_CLI.exe', 'BUILD_INFO.txt', 'HuongDan/HUONG_DAN_AI_TU_ANH_THANH_CAD.md', 'HuongDan/HUONG_DAN_AI_TU_ANH_THANH_CAD.docx', 'HuongDan/GIAO_TRINH_TONG_HOP_CAD360.docx')) {
            if (!(Test-Path (Join-Path $dest $n))) { throw "Installed file missing: $n" }
          }
          $srcGui = (Get-FileHash 'CADTBT360_V1.000/target/release/cadcraft.exe' -Algorithm SHA256).Hash
          $srcCli = (Get-FileHash 'CADTBT360_V1.000/target/release/cadcraft-cli.exe' -Algorithm SHA256).Hash
          $instGui = (Get-FileHash (Join-Path $dest 'CADTBT360.exe') -Algorithm SHA256).Hash
          $instCli = (Get-FileHash (Join-Path $dest 'CADTBT360_CLI.exe') -Algorithm SHA256).Hash
          if ($srcGui -ne $instGui -or $srcCli -ne $instCli) { throw 'Installed binaries do not match current source build' }
          & ./scripts/verify_mcp_executable.ps1 -Exe (Join-Path $dest 'CADTBT360_CLI.exe')
          if ($LASTEXITCODE -ne 0) { throw 'Installed MCP stdio smoke failed' }
          # SHA identity alone cannot detect a package built for the wrong CPU or a
          # GUI shipped as a console executable. Inspect PE headers in the actual
          # installed EXEs; portable files are independently hash-matched to these.
          function Assert-WindowsPE([string]$path, [int]$expectedSubsystem) {
            $data = [System.IO.File]::ReadAllBytes($path)
            if ($data.Length -lt 512 -or $data[0] -ne 77 -or $data[1] -ne 90) { throw "Invalid Windows MZ executable: $path" }
            $offset = [System.BitConverter]::ToInt32($data, 60)
            if ($offset -lt 64 -or $offset + 94 -gt $data.Length) { throw "Invalid Windows PE header offset: $path" }
            if ([System.Text.Encoding]::ASCII.GetString($data, $offset, 4) -ne "PE`0`0") { throw "Missing Windows PE signature: $path" }
            $machine = [System.BitConverter]::ToUInt16($data, $offset + 4)
            $magic = [System.BitConverter]::ToUInt16($data, $offset + 24)
            $subsystem = [System.BitConverter]::ToUInt16($data, $offset + 92)
            if ($machine -ne 0x8664 -or $magic -ne 0x20b) { throw "Expected native x64 PE32+ executable: $path (machine=$machine, magic=$magic)" }
            if ($subsystem -ne $expectedSubsystem) { throw "Wrong Windows subsystem in $path : expected $expectedSubsystem, got $subsystem" }
          }
          Assert-WindowsPE (Join-Path $dest 'CADTBT360.exe') 2
          Assert-WindowsPE (Join-Path $dest 'CADTBT360_CLI.exe') 3
          $installedCli = Join-Path $dest 'CADTBT360_CLI.exe'
          $cliVersion = & $installedCli --version
          if ($LASTEXITCODE -ne 0 -or $cliVersion -notmatch '^cadcraft-cli [0-9]+[.][0-9]+[.][0-9]+') { throw "Installed CLI smoke test failed: $cliVersion" }
          $imageCommands = & $installedCli commands image
          if ($LASTEXITCODE -ne 0 -or ($imageCommands -join [char]10) -notmatch 'imageattach') { throw 'Installed CLI does not expose IMAGEATTACH command' }
          $roundTripFile = Join-Path $env:RUNNER_TEMP 'CADTBT360_V1025_Installed_Smoke.dxf'
          & $installedCli sample floorplan $roundTripFile | Out-Host
          if ($LASTEXITCODE -ne 0 -or !(Test-Path $roundTripFile)) { throw 'Installed CLI cannot create an editable DXF drawing' }
          $roundTripInfo = & $installedCli info $roundTripFile
          if ($LASTEXITCODE -ne 0) { throw 'Installed CLI cannot reopen generated DXF drawing' }
          $drawingInfo = ($roundTripInfo -join [char]10) | ConvertFrom-Json
          if ($null -eq $drawingInfo.entityCount -or $drawingInfo.entityCount -le 0) { throw 'Installed CLI reopened DXF without CAD entities' }
          $dwgFile = Join-Path $env:RUNNER_TEMP 'CADTBT360_V1025_Installed_Interop.dwg'
          & $installedCli run --metric --cmd 'line {"points":[[0,0],[12,3],[25,8]]}' --save $dwgFile | Out-Host
          if ($LASTEXITCODE -ne 0 -or !(Test-Path $dwgFile)) { throw 'Installed CLI cannot write an editable DWG drawing' }
          $dwgBytes = [System.IO.File]::ReadAllBytes($dwgFile)
          if ($dwgBytes.Length -lt 64 -or [System.Text.Encoding]::ASCII.GetString($dwgBytes, 0, 6) -ne 'AC1032') { throw 'Installed CLI did not produce an R2018 DWG (AC1032)' }
          $dwgInfoLines = & $installedCli info $dwgFile
          if ($LASTEXITCODE -ne 0) { throw 'Installed CLI cannot reopen exported DWG' }
          $dwgInfo = ($dwgInfoLines -join [char]10) | ConvertFrom-Json
          if ($dwgInfo.counts.Line -ne 2) { throw "DWG roundtrip lost CAD geometry: $($dwgInfoLines -join [char]10)" }

          # Use a real PNG source. A fabricated 'reference.png' string would only test
          # IMAGE metadata, not the installed application's ability to link an image file.
          Add-Type -AssemblyName System.Drawing
          $referenceFile = Join-Path $env:RUNNER_TEMP 'CADTBT360_V1025_TraceReference.png'
          $bitmap = [System.Drawing.Bitmap]::new(200, 100)
          try {
            $bitmap.SetPixel(0, 0, [System.Drawing.Color]::Red)
            $bitmap.SetPixel(199, 99, [System.Drawing.Color]::Blue)
            $bitmap.Save($referenceFile, [System.Drawing.Imaging.ImageFormat]::Png)
          } finally { $bitmap.Dispose() }
          if (!(Test-Path $referenceFile) -or (Get-Item $referenceFile).Length -le 0) { throw 'Cannot generate real PNG fixture for IMAGE trace smoke' }
          $referencePath = $referenceFile.Replace([char]92, [char]47)
          $attachJson = @{ path = $referencePath; pixels = @(200, 100); width = 20; height = 10 } | ConvertTo-Json -Compress
          $traceFile = Join-Path $env:RUNNER_TEMP 'CADTBT360_V1025_AI_ImageTrace_Smoke.dxf'
          & $installedCli run --metric --cmd "imageattach $attachJson" --cmd 'imagetrace {"handle":"{last}","points":[[0,100],[200,100],[200,0]]}' --save $traceFile | Out-Host
          if ($LASTEXITCODE -ne 0 -or !(Test-Path $traceFile)) { throw 'Installed CLI cannot produce AI-traced DXF with IMAGE and LWPOLYLINE' }
          $traceInfo = & $installedCli info $traceFile
          if ($LASTEXITCODE -ne 0) { throw 'Installed CLI cannot reopen AI-traced DXF' }
          $traceDrawing = ($traceInfo -join [char]10) | ConvertFrom-Json
          if ($traceDrawing.entityCount -ne 2 -or $traceDrawing.counts.'Raster Image' -ne 1 -or $traceDrawing.counts.Polyline -ne 1) {
            throw "AI image-trace DXF must contain exactly one Raster Image and one editable Polyline, found: $($traceInfo -join [char]10)"
          }
          # Check the linked PNG path after DXF save/reopen. EntityKind uses
          # #[serde(tag = "type", rename_all = "camelCase")]: the IMAGE's path is
          # directly under geometry, not geometry.Image.path.
          $imageOutput = & $installedCli run $traceFile --cmd 'entities {"type":"IMAGE"}'
          if ($LASTEXITCODE -ne 0) { throw 'Installed CLI cannot query saved IMAGE reference' }
          $imageQuery = ($imageOutput -join [char]10) | ConvertFrom-Json
          if ($imageQuery.count -ne 1 -or @($imageQuery.entities).Count -ne 1) { throw 'DXF reopened with missing or duplicated IMAGE reference' }
          $savedImage = $imageQuery.entities[0].geometry
          if ($null -eq $savedImage -or $savedImage.type -ne 'image' -or [string]::IsNullOrWhiteSpace($savedImage.path)) { throw 'DXF lost internally tagged IMAGE geometry or its source path' }
          $savedImagePath = ([string]$savedImage.path).Replace([char]92, [char]47)
          if ($savedImagePath -ne $referencePath) { throw "DXF IMAGE path changed: expected $referencePath, found $savedImagePath" }
          if (!(Test-Path $savedImagePath)) { throw "Reopened DXF references a missing PNG: $savedImagePath" }
          $openedImage = [System.Drawing.Image]::FromFile($savedImagePath)
          try {
            if ($openedImage.Width -ne 200 -or $openedImage.Height -ne 100) { throw 'Reopened DXF source PNG has incorrect dimensions' }
          } finally { $openedImage.Dispose() }
          $geometryOutput = & $installedCli run $traceFile --cmd 'entities {"type":"LWPOLYLINE"}'
          if ($LASTEXITCODE -ne 0) { throw 'Installed CLI cannot query persisted editable LWPOLYLINE' }
          $geometry = ($geometryOutput -join [char]10) | ConvertFrom-Json
          if ($geometry.count -ne 1 -or $geometry.entities.Count -ne 1) { throw 'Saved AI trace does not contain exactly one queryable Polyline' }
          # EntityKind is internally tagged: geometry.type = 'lwPolyline' and
          # editable vertices live directly under geometry.vertices.
          $polylineEntity = $geometry.entities[0]
          $polyline = $polylineEntity.geometry
          if ($polylineEntity.type -ne 'Polyline' -or $null -eq $polyline -or $polyline.type -ne 'lwPolyline') {
            throw "Saved AI trace returned the wrong entity kind: $($polylineEntity | ConvertTo-Json -Depth 8 -Compress)"
          }
          $vertices = @($polyline.vertices)
          if ($vertices.Count -ne 3 -or $polyline.closed -ne $false) {
            throw "Saved AI trace must be one open editable three-vertex LWPOLYLINE, got $($polyline | ConvertTo-Json -Depth 8 -Compress)"
          }
          $expected = @(
            [pscustomobject]@{ x = 0.0; y = 0.0 },
            [pscustomobject]@{ x = 20.0; y = 0.0 },
            [pscustomobject]@{ x = 20.0; y = 10.0 }
          )
          for ($i = 0; $i -lt $expected.Count; $i++) {
            $point = $vertices[$i].p
            if ($null -eq $point -or [math]::Abs([double]$point.x - $expected[$i].x) -gt 1e-7 -or [math]::Abs([double]$point.y - $expected[$i].y) -gt 1e-7) {
              throw "Saved AI trace vertex $i mismatch: actual=$($point | ConvertTo-Json -Compress), expected=($($expected[$i].x),$($expected[$i].y))"
            }
          }
          $installedBuildInfo = Get-Content (Join-Path $dest 'BUILD_INFO.txt')
          if ($installedBuildInfo -notcontains 'Release=CADTBT360_V1.025' -or $installedBuildInfo -notcontains "SourceCommit=$env:GITHUB_SHA" -or $installedBuildInfo -notcontains 'NativeBuild=true') {
            throw "Installed build metadata does not identify this native release commit: $($installedBuildInfo -join '; ')"
          }
          $installedGeneralGuide = Join-Path $dest 'HuongDan/GIAO_TRINH_TONG_HOP_CAD360.docx'
          if ((Get-FileHash $installedGeneralGuide -Algorithm SHA256).Hash -ne (Get-FileHash 'dist/v1025/CADTBT360_V1.025_GIAO_TRINH_TONG_HOP.docx' -Algorithm SHA256).Hash) { throw 'Installed full-product curriculum differs from release manual' }
          $installedDocx = Join-Path $dest 'HuongDan/HUONG_DAN_AI_TU_ANH_THANH_CAD.docx'
          $sourceDocx = 'dist/v1025/CADTBT360_V1.025_HUONG_DAN_AI_TU_ANH_THANH_CAD.docx'
          if ((Get-FileHash $installedDocx -Algorithm SHA256).Hash -ne (Get-FileHash $sourceDocx -Algorithm SHA256).Hash) {
            throw 'Installed Word guide does not match release document'
          }
          $packagedBuildInfoHash = (Get-FileHash 'dist/v1025/BUILD_INFO.txt' -Algorithm SHA256).Hash
          $installedBuildInfoHash = (Get-FileHash (Join-Path $dest 'BUILD_INFO.txt') -Algorithm SHA256).Hash
          if ($installedBuildInfoHash -ne $packagedBuildInfoHash) { throw 'Installed BUILD_INFO.txt differs from verified release metadata' }
          $uninstaller = Join-Path $dest 'unins000.exe'
          if (!(Test-Path $uninstaller)) { throw 'Missing Inno Setup uninstaller' }
          $uninstall = Start-Process -FilePath $uninstaller -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART') -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) { throw "Uninstaller failed with code $($uninstall.ExitCode)" }
          if (Test-Path (Join-Path $dest 'CADTBT360.exe')) { throw 'Uninstaller left main executable behind' }

      - name: Verify portable archive, create SHA256 checksums
        id: portable_smoke
        shell: pwsh
        run: |
          $zip = 'dist/v1025/CADTBT360_V1.025_Portable_Windows_x64.zip'
          $tmp = Join-Path $env:RUNNER_TEMP 'CADTBT360_V1025_PortableTest'
          Expand-Archive $zip -DestinationPath $tmp -Force
          foreach ($n in @('CADTBT360.exe', 'CADTBT360_CLI.exe', 'BUILD_INFO.txt', 'HUONG_DAN_AI_TU_ANH_THANH_CAD.md', 'HUONG_DAN_AI_TU_ANH_THANH_CAD.docx', 'GIAO_TRINH_TONG_HOP_CAD360.docx')) {
            if (!(Test-Path (Join-Path $tmp $n))) { throw "Portable archive missing $n" }
          }
          $guideHash = (Get-FileHash (Join-Path $tmp 'HUONG_DAN_AI_TU_ANH_THANH_CAD.md') -Algorithm SHA256).Hash
          $sourceGuideHash = (Get-FileHash 'docs/user-guide/CADTBT360_V1.025_HUONG_DAN_AI_TU_ANH_THANH_CAD.md' -Algorithm SHA256).Hash
          $docxHash = (Get-FileHash (Join-Path $tmp 'HUONG_DAN_AI_TU_ANH_THANH_CAD.docx') -Algorithm SHA256).Hash
          $releaseDocxHash = (Get-FileHash 'dist/v1025/CADTBT360_V1.025_HUONG_DAN_AI_TU_ANH_THANH_CAD.docx' -Algorithm SHA256).Hash
          if ($docxHash -ne $releaseDocxHash) { throw 'Portable Word manual differs from the packaged release manual' }
          $fullGuideSource = 'dist/v1025/CADTBT360_V1.025_GIAO_TRINH_TONG_HOP.docx'
          $fullGuidePortable = Join-Path $tmp 'GIAO_TRINH_TONG_HOP_CAD360.docx'
          if ((Get-FileHash $fullGuideSource -Algorithm SHA256).Hash -ne (Get-FileHash $fullGuidePortable -Algorithm SHA256).Hash) { throw 'Full-product user guide in Portable differs from published guide' }
          python -c "import sys,zipfile,xml.etree.ElementTree as ET; z=zipfile.ZipFile(sys.argv[1]); assert z.testzip() is None; x=ET.fromstring(z.read('word/document.xml')); assert len(z.read('word/document.xml')) > 8000" $fullGuidePortable
          if ($LASTEXITCODE -ne 0) { throw 'Whole-product Word curriculum is damaged or empty' }
          python -c "import sys,zipfile,xml.etree.ElementTree as ET; p=sys.argv[1]; z=zipfile.ZipFile(p); assert z.testzip() is None; ET.fromstring(z.read('word/document.xml')); assert len(z.read('word/document.xml')) > 1500" (Join-Path $tmp 'HUONG_DAN_AI_TU_ANH_THANH_CAD.docx')
          if ($LASTEXITCODE -ne 0) { throw 'Portable Word manual is damaged or invalid' }
          if ($guideHash -ne $sourceGuideHash) { throw 'Portable user guide differs from release source' }
          $portableGuiHash = (Get-FileHash (Join-Path $tmp 'CADTBT360.exe') -Algorithm SHA256).Hash
          $portableCliHash = (Get-FileHash (Join-Path $tmp 'CADTBT360_CLI.exe') -Algorithm SHA256).Hash
          $nativeGuiHash = (Get-FileHash 'CADTBT360_V1.000/target/release/cadcraft.exe' -Algorithm SHA256).Hash
          $nativeCliHash = (Get-FileHash 'CADTBT360_V1.000/target/release/cadcraft-cli.exe' -Algorithm SHA256).Hash
          if ($portableGuiHash -ne $nativeGuiHash -or $portableCliHash -ne $nativeCliHash) { throw 'Portable executables do not match freshly compiled release' }
          & ./scripts/verify_mcp_executable.ps1 -Exe (Join-Path $tmp 'CADTBT360_CLI.exe')
          if ($LASTEXITCODE -ne 0) { throw 'Portable MCP stdio smoke failed' }
          $portableInfoHash = (Get-FileHash (Join-Path $tmp 'BUILD_INFO.txt') -Algorithm SHA256).Hash
          $releaseInfoHash = (Get-FileHash 'dist/v1025/BUILD_INFO.txt' -Algorithm SHA256).Hash
          if ($portableInfoHash -ne $releaseInfoHash) { throw 'Portable BUILD_INFO.txt does not match the Setup release metadata' }
          $portableBuildInfo = Get-Content (Join-Path $tmp 'BUILD_INFO.txt')
          if ($portableBuildInfo -notcontains 'Release=CADTBT360_V1.025' -or $portableBuildInfo -notcontains "SourceCommit=$env:GITHUB_SHA" -or $portableBuildInfo -notcontains 'NativeBuild=true') {
            throw "Portable archive metadata does not identify this native release commit: $($portableBuildInfo -join '; ')"
          }
          $portableCli = Join-Path $tmp 'CADTBT360_CLI.exe'
          $portableVersion = & $portableCli --version
          if ($LASTEXITCODE -ne 0 -or $portableVersion -notmatch '^cadcraft-cli [0-9]+[.][0-9]+[.][0-9]+') { throw "Portable CLI startup failed: $portableVersion" }
          # Run the executable extracted from the ZIP, not the build-tree or installed
          # CLI. Require it to create a real DXF, convert that DXF to DWG R2018,
          # and reopen both without losing editable CAD entities.
          $portableDxf = Join-Path $tmp 'Portable Roundtrip Test.dxf'
          $portableDwg = Join-Path $tmp 'Portable Roundtrip Test.dwg'
          & $portableCli sample bracket $portableDxf | Out-Host
          if ($LASTEXITCODE -ne 0 -or !(Test-Path $portableDxf)) { throw 'Portable CLI cannot create DXF from sample' }
          & $portableCli convert $portableDxf $portableDwg | Out-Host
          if ($LASTEXITCODE -ne 0 -or !(Test-Path $portableDwg)) { throw 'Portable CLI cannot convert DXF to DWG' }
          $portableDwgBytes = [System.IO.File]::ReadAllBytes($portableDwg)
          if ($portableDwgBytes.Length -lt 64 -or [System.Text.Encoding]::ASCII.GetString($portableDwgBytes, 0, 6) -ne 'AC1032') {
            throw 'Portable CLI did not produce an R2018 DWG'
          }
          $portableDxfInfo = & $portableCli info $portableDxf
          if ($LASTEXITCODE -ne 0) { throw 'Portable CLI cannot reopen its DXF' }
          $portableDwgInfo = & $portableCli info $portableDwg
          if ($LASTEXITCODE -ne 0) { throw 'Portable CLI cannot reopen its DWG' }
          $portableDxfDrawing = ($portableDxfInfo -join [char]10) | ConvertFrom-Json
          $portableDwgDrawing = ($portableDwgInfo -join [char]10) | ConvertFrom-Json
          if ($portableDxfDrawing.entityCount -le 0 -or $portableDwgDrawing.entityCount -ne $portableDxfDrawing.entityCount) {
            throw "Portable DXF/DWG entity roundtrip mismatch: DXF=$($portableDxfDrawing.entityCount), DWG=$($portableDwgDrawing.entityCount)"
          }
          # Release exactly the same committed source as the binaries and guide,
          # rather than leaving users to reconstruct a moving branch snapshot.
          $sourceZip = 'dist/v1025/CADTBT360_V1.025_Full_Source.zip'
          $headSha = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $headSha -ne $env:GITHUB_SHA) { throw 'Source checkout SHA differs from release build' }
          git archive --format=zip --output=$sourceZip HEAD
          if ($LASTEXITCODE -ne 0 -or !(Test-Path $sourceZip)) { throw 'Failed to archive complete CAD 360 source at release commit' }
          python scripts/verify_source_bundle.py $sourceZip
          if ($LASTEXITCODE -ne 0) { throw 'Full source ZIP missing files or differs from the exact release SHA' }
          $hashes = @()
          foreach ($name in @('CADTBT360_V1.025_Setup_Windows_x64.exe', 'CADTBT360_V1.025_Portable_Windows_x64.zip', 'CADTBT360_V1.025_Full_Source.zip')) {
            $h = Get-FileHash (Join-Path 'dist/v1025' $name) -Algorithm SHA256
            $hashes += "$($h.Hash)  $name"
          }
          $hashes | Set-Content dist/v1025/SHA256SUMS.txt -Encoding ascii

      - name: Upload V1.025 Windows Setup and Portable
        uses: actions/upload-artifact@v4
        with:
          name: CADTBT360_V1.025_Windows_x64_Setup_Portable
          path: |
            dist/v1025/CADTBT360_V1.025_Setup_Windows_x64.exe
            dist/v1025/CADTBT360_V1.025_Portable_Windows_x64.zip
            dist/v1025/CADTBT360_V1.025_Full_Source.zip
            dist/v1025/BUILD_INFO.txt
            dist/v1025/SHA256SUMS.txt
            dist/v1025/HUONG_DAN_AI_TU_ANH_THANH_CAD.md
            dist/v1025/CADTBT360_V1.025_HUONG_DAN_AI_TU_ANH_THANH_CAD.docx
            dist/v1025/CADTBT360_V1.025_GIAO_TRINH_TONG_HOP.docx
          if-no-files-found: error
          retention-days: 30

      - name: Publish verified Setup and Portable to GitHub prereleases
        if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/feature/CADTBT360_V1.025_xref-regression' }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "CADTBT360_V1.025_B$($env:GITHUB_RUN_NUMBER)_A$($env:GITHUB_RUN_ATTEMPT)"
          $assets = @(
            'dist/v1025/CADTBT360_V1.025_Setup_Windows_x64.exe',
            'dist/v1025/CADTBT360_V1.025_Portable_Windows_x64.zip',
            'dist/v1025/CADTBT360_V1.025_Full_Source.zip',
            'dist/v1025/BUILD_INFO.txt',
            'dist/v1025/SHA256SUMS.txt',
            'dist/v1025/HUONG_DAN_AI_TU_ANH_THANH_CAD.md',
            'dist/v1025/CADTBT360_V1.025_HUONG_DAN_AI_TU_ANH_THANH_CAD.docx',
            'dist/v1025/CADTBT360_V1.025_GIAO_TRINH_TONG_HOP.docx'
          )
          foreach ($asset in $assets) { if (!(Test-Path $asset)) { throw "Verified release asset missing: $asset" } }
          $notes = "CAD 360 Viet Nam V1.025 Windows x64 - verified automated build `nSource commit: $env:GITHUB_SHA`nRun: $env:GITHUB_RUN_ID`nSetup install/uninstall, CLI DXF/DWG roundtrips, real-PNG IMAGE attachment with supplied trace vertices, and Portable hashes checked. Setup/Portable MCP smoke checks real-PNG LINE recognition, grouped Undo, and save/reopen of AI-generated DXF/DWG R2018 using the shipped CLI. The release also bundles a full-source ZIP from the exact build commit and the editable Vietnamese Word user guide. Independent AutoCAD interoperability, real-world AI accuracy and manual GUI acceptance are not verified."
          gh release create $tag @assets --title "CAD 360 Viet Nam V1.025 - Build $env:GITHUB_RUN_NUMBER" --target $env:GITHUB_SHA --prerelease --notes $notes
          if ($LASTEXITCODE -ne 0) { throw "Failed to publish verified Windows prerelease $tag" }
          # Verify what GitHub actually accepted, not just the local files and
          # gh upload exit code. Every release asset must exist with the same
          # nonzero byte length; the tag must identify the build's exact SHA.
          $releaseJson = gh release view $tag --json tagName,targetCommitish,isPrerelease,assets
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace(($releaseJson -join ''))) { throw "Cannot verify newly published Windows release $tag" }
          $published = ($releaseJson -join [char]10) | ConvertFrom-Json
          if ($published.tagName -ne $tag -or $published.targetCommitish -ne $env:GITHUB_SHA -or $published.isPrerelease -ne $true) {
            throw "GitHub release identity does not match expected tag, exact source commit and prerelease status: $tag"
          }
          foreach ($asset in $assets) {
            $name = Split-Path $asset -Leaf
            $expectedSize = (Get-Item $asset).Length
            $match = @($published.assets | Where-Object { $_.name -eq $name })
            if ($expectedSize -le 0 -or $match.Count -ne 1 -or [long]$match[0].size -ne $expectedSize) {
              throw "GitHub release $tag is missing or has an invalid uploaded asset: $name (expected $expectedSize bytes)"
            }
          }
          Write-Host "Verified GitHub prerelease $tag with all $($assets.Count) assets, matching sizes and source commit"
          "GitHub prerelease: https://github.com/$env:GITHUB_REPOSITORY/releases/tag/$tag" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - name: Save failed or cancelled build diagnostics for V1.025
        if: ${{ failure() || cancelled() }}
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/v1025/diagnostics | Out-Null
          Write-Host 'Preparing diagnostic artifact for failed or cancelled Windows release'
          $lines = @(
            'Release=CADTBT360_V1.025',
            "SourceCommit=$env:GITHUB_SHA",
            "RunId=$env:GITHUB_RUN_ID",
            "RunAttempt=$env:GITHUB_RUN_ATTEMPT",
            "RunnerOS=$env:RUNNER_OS",
            'FixtureValidation=${{ steps.validate_fixture.outcome }}',
            'FullManuals=${{ steps.manuals.outcome }}',
            'Preflight=${{ steps.preflight.outcome }}',
            'TestDiscovery=${{ steps.discover.outcome }}',
            'CliJsonContract=${{ steps.cli_contract.outcome }}',
            'ImageMCPTests=${{ steps.ai_tests.outcome }}',
            'XrefDWGTests=${{ steps.cad_tests.outcome }}',
            'ReleaseBuild=${{ steps.release_build.outcome }}',
            'InstallerPrepare=${{ steps.prepare_installer.outcome }}',
            'Package=${{ steps.package.outcome }}',
            'InstalledSmoke=${{ steps.installed_smoke.outcome }}',
            'PortableSmoke=${{ steps.portable_smoke.outcome }}'
          )
          $lines | Set-Content dist/v1025/diagnostics/CI_FAILURE.txt -Encoding utf8
          rustc --version 2>&1 | Out-File dist/v1025/diagnostics/RUST_VERSION.txt -Encoding utf8
          cargo --version 2>&1 | Out-File dist/v1025/diagnostics/CARGO_VERSION.txt -Encoding utf8
          Get-ChildItem dist/v1025 -File -ErrorAction SilentlyContinue | Select-Object Name,Length,LastWriteTimeUtc | Format-Table -AutoSize | Out-String | Set-Content dist/v1025/diagnostics/DIST_FILES.txt -Encoding utf8
          $lines | ForEach-Object { Write-Host $_ }
          "### CAD 360 V1.025 - failed Windows release" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          ($lines -join "`n") | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - name: Upload V1.025 diagnostics on failed or cancelled build
        if: ${{ failure() || cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: CADTBT360_V1.025_Windows_x64_Failure_Diagnostics
          path: dist/v1025/diagnostics/
          if-no-files-found: warn
          retention-days: 30
