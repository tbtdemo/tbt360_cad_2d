name: CAD 360 AI Ollama Native Safety Gate
on:
  push:
    branches:
      - feature/CADTBT360_V1.025_xref-regression
    paths:
      - 'CADTBT360_V1.000/apps/cadcraft/src/ai_local_provider.rs'
      - 'CADTBT360_V1.000/apps/cadcraft/src/ai_raster_panel.rs'
      - 'CADTBT360_V1.000/crates/ui-egui/src/ai_review.rs'
      - '.github/workflows/cad360-ai-ollama-safety.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cad360-ollama-safety-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native-ollama-safety:
    name: Rust Windows compile and Ollama CAD validation tests
    runs-on: windows-latest
    timeout-minutes: 70
    defaults:
      run:
        working-directory: CADTBT360_V1.000
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: CADTBT360_V1.000
      - name: Ensure AI Studio starts in focused image tab with appropriate stroke limit
        run: cargo test --locked -p cadcraft --bin cadcraft ai_studio_primary_tab_is_image_workflow_and_advanced_settings_are_separate -- --nocapture
      - name: Ensure AI Studio preview accepts 274-stroke demo below adjustable limit
        run: cargo test --locked -p cadcraft --bin cadcraft ai_studio_default_handles_274_strokes_without_silent_truncation -- --nocapture
      - name: Ensure AI Review starts with command tab after handoff
        run: cargo test --locked -p cadcraft-ui-egui ai_review_starts_with_horizontal_native_command_tab -- --nocapture
      - name: Validate desktop native compilation including Ollama adapter
        run: cargo check --locked -p cadcraft
      - name: Verify actual raster CAD commit rejects source and calibration changes after preview
        run: cargo test --locked -p cadcraft --bin cadcraft ai_raster_commit_guard_rejects_changed_image_and_calibration_after_preview -- --nocapture
      - name: Confirm PDF cancellation stops before launching Poppler
        run: cargo test --locked -p cadcraft --bin cadcraft ai_pdf_cancel_refuses_before_poppler_spawn_and_keeps_no_raster -- --nocapture
      - name: Refuse CAD commit if source PDF changed after raster preview
        run: cargo test --locked -p cadcraft --bin cadcraft ai_pdf_commit_guard_refuses_modified_original_after_successful_page_preview -- --nocapture
      - name: Reject silently changed PDF source between raster render and AI Studio accept
        run: cargo test --locked -p cadcraft --bin cadcraft ai_pdf_source_fingerprint_rejects_same_length_mutation -- --nocapture
      - name: Detect modified source image before accepting AI raster preview
        run: cargo test --locked -p cadcraft --bin cadcraft ai_image_fingerprint_detects_same_size_source_mutation_without_timestamp_check -- --nocapture
      - name: Ensure image recognition prompt never becomes a native CAD geometry command
        run: cargo test --locked -p cadcraft --bin cadcraft ai_studio_separates_image_detection_instruction_from_native_cad_commands -- --nocapture
      - name: Verify cancelled AI request stops before launching Ollama
        run: cargo test --locked -p cadcraft --bin cadcraft cancelled_local_ai_request_never_launches_ollama -- --nocapture
      - name: Verify cancelling UI request never retains a CAD proposal
        run: cargo test --locked -p cadcraft --bin cadcraft ai_local_cancel_flag_never_changes_document_or_approval_state -- --nocapture
      - name: Validate local Ollama model ID protection
        run: cargo test --locked -p cadcraft --bin cadcraft model_id_refuses_shell_injection_and_path_tricks -- --nocapture
      - name: Reject fabricated and multi-command Ollama responses
        run: cargo test --locked -p cadcraft --bin cadcraft response_accepts_one_native_candidate_and_only_safe_simple_fences -- --nocapture
      - name: Validate local prompt length and control-character boundary
        run: cargo test --locked -p cadcraft --bin cadcraft local_model_request_is_bounded_and_not_executed -- --nocapture
      - name: Confirm model proposed command cannot skip native CAD review
        run: cargo test --locked -p cadcraft --bin cadcraft ai_local_llm_is_optional_and_does_not_commit_native_cad_on_open -- --nocapture
      - name: Verify one-click architecture preset activates reviewed wall door column and room detection
        run: cargo test --locked -p cadcraft --bin cadcraft ai_architecture_one_click_preset_enables_walls_openings_columns_and_rooms_evidence -- --nocapture
      - name: Verify AI-generated geometry supports endpoint midpoint and center OSNAP
        run: cargo test --locked -p cadcraft-ui-egui ai_generated_native_cad_objects_are_real_endpoint_midpoint_and_center_snap_targets -- --nocapture
      - name: Verify 274-stroke plan still recognizes paired wall panels
        run: cargo test --locked -p cadcraft-mcp ai_architecture_wall_pair_recognition_keeps_candidates_above_256_strokes -- --nocapture
      - name: Verify enclosed-room geometry above the legacy 256-line limit
        run: cargo test --locked -p cadcraft-mcp ai_architecture_recognizes_closed_room_outline_in_274_line_plan -- --nocapture
      - name: Verify real PNG yields review-only architectural room evidence
        run: cargo test --locked -p cadcraft-mcp ai_architecture_room_candidate_is_only_evidence_and_never_auto_commits -- --nocapture
      - name: Verify AI-built native CAD survives standard R2018 DWG save and reopen
        run: cargo test --locked -p cadcraft-ui-egui ai_review_native_three_object_plan_roundtrips_as_standard_r2018_dwg -- --nocapture
      - name: Validate actual multi-object commit with one Undo and Redo
        run: cargo test --locked -p cadcraft-ui-egui ai_multi_object_plan_commits_three_editable_entities_and_one_undo_group -- --nocapture
      - name: Validate rollback after partial native CAD AI execution failure
        run: cargo test --locked -p cadcraft-ui-egui ai_multi_object_runtime_failure_rolls_back_first_created_native_entity -- --nocapture
      - name: Validate invalid multi-command plan never mutates document
        run: cargo test --locked -p cadcraft-ui-egui ai_multi_object_plan_rejects_bad_command_without_starting_undo_or_writing_cad -- --nocapture
      - name: Validate atomic multi-object CAD plan and step count limits
        run: cargo test --locked -p cadcraft-ui-egui ai_review_multi_object_plan_is_atomic_at_parser_and_bounded -- --nocapture
      - name: Verify native command review parser rejects destructive requests
        run: cargo test --locked -p cadcraft-ui-egui stage258_room_parser_accepts_vietnamese_and_rejects_invalid_geometry -- --nocapture
