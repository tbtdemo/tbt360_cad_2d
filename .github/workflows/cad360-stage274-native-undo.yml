name: CAD 360 Stage274 Single and Grouped Native Undo Contract
on:
  push:
    branches:
      - feature/CADTBT360_V1.025_xref-regression
    paths:
      - CADTBT360_V1.000/crates/ui-egui/src/ai_review.rs
      - .github/workflows/cad360-stage274-native-undo.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-undo:
    runs-on: windows-latest
    timeout-minutes: 100
    defaults:
      run:
        working-directory: CADTBT360_V1.000
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.95.0'
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: CADTBT360_V1.000
      - name: Show SHA and toolchain
        shell: pwsh
        run: |
          git rev-parse HEAD
          rustc --version
          cargo --version
      - name: Compile Windows CAD AI Review
        run: cargo check --locked -p cadcraft-ui-egui
      - name: Stage274 grouped single command and rollback tests
        run: cargo test --locked -p cadcraft-ui-egui stage274 -- --nocapture
      - name: Stage273 managed wall snapshots and partial failure
        run: cargo test --locked -p cadcraft-ui-egui stage273 -- --nocapture
      - name: Stage272 approved controls
        run: cargo test --locked -p cadcraft-ui-egui stage272 -- --nocapture
      - name: Earlier raster image-to-native commands
        run: cargo test --locked -p cadcraft-ui-egui stage26 -- --nocapture
